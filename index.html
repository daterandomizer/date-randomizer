<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Рандомайзер Свиданий</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            background: linear-gradient(135deg, #ffe0e5 0%, #ffd4d8 25%, #f5d5d0 50%, #ead5d5 75%, #e0d0d0 100%);
            min-height: 100vh;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,182,193,0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(216,191,216,0.1) 0%, transparent 70%);
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        /* Анимированные сердечки на фоне */
        .heart-decoration {
            position: fixed;
            color: #d4a5a5;              /* сплошной цвет: прозрачностью управляет только opacity */
            font-size: 40px;
            opacity: 0.12;
            animation: floatHeart 15s infinite ease-in-out both;  /* both = не «прыгать» во время задержки */
            pointer-events: none;
            z-index: 1;
            user-select: none;
        }

        .heart-decoration:nth-child(1) { 
            top: 10%; 
            left: 5%; 
            animation-delay: 0s; 
            font-size: 35px;
        }
        .heart-decoration:nth-child(2) { 
            top: 20%; 
            right: 8%; 
            animation-delay: 3s; 
            font-size: 45px;
        }
        .heart-decoration:nth-child(3) { 
            bottom: 25%; 
            left: 10%; 
            animation-delay: 6s; 
            font-size: 30px;
        }
        .heart-decoration:nth-child(4) { 
            bottom: 15%; 
            right: 12%; 
            animation-delay: 9s; 
            font-size: 50px;
        }
        .heart-decoration:nth-child(5) { 
            top: 50%; 
            left: 15%; 
            animation-delay: 4s; 
            font-size: 38px;
        }
        .heart-decoration:nth-child(6) { 
            top: 60%; 
            right: 15%; 
            animation-delay: 7s; 
            font-size: 42px;
        }
        .heart-decoration:nth-child(7) { 
            top: 35%; 
            right: 5%; 
            animation-delay: 2s; 
            font-size: 33px;
        }
        .heart-decoration:nth-child(8) { 
            bottom: 40%; 
            left: 3%; 
            animation-delay: 5s; 
            font-size: 36px;
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg);        opacity: 0.12; }
            25%      { transform: translateY(-20px) scale(1.1) rotate(5deg);  opacity: 0.18; }
            50%      { transform: translateY(-10px) scale(0.95) rotate(-3deg); opacity: 0.14; }
            75%      { transform: translateY(-30px) scale(1.05) rotate(7deg); opacity: 0.21; }
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Заголовок без сердец - просто текст по центру */
        .header h1 {
            background: linear-gradient(135deg, #c47d8a 0%, #a06570 50%, #8b5e5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #a07878;
            font-size: 0.95em;
            font-weight: 400;
            opacity: 0.9;
            padding: 0 10px;
        }

        .icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .icon-lg {
            width: 22px;
            height: 22px;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 
                0 10px 40px rgba(139, 94, 94, 0.15),
                0 2px 10px rgba(139, 94, 94, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeInUp 0.8s ease-out;
        }

        /* ===== Сердечки внутри основной плашки ===== */
        .card-hearts {
            position: absolute;
            inset: 0;
            border-radius: 25px;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .card-hearts span {
            position: absolute;
            color: #c98d8d;              /* сплошной цвет: прозрачностью управляет только opacity */
            opacity: 0.12;
            animation: floatHeartCard 14s infinite ease-in-out both;  /* both = не «прыгать» во время задержки */
            user-select: none;
            line-height: 1;
        }

        .card-hearts span:nth-child(1) { top: 6%;  left: 6%;  font-size: 34px; animation-delay: 0s; }
        .card-hearts span:nth-child(2) { top: 13%; right: 9%; font-size: 26px; animation-delay: 2.5s; }
        .card-hearts span:nth-child(3) { top: 42%; left: 3%;  font-size: 30px; animation-delay: 5s; }
        .card-hearts span:nth-child(4) { bottom: 18%; right: 5%; font-size: 38px; animation-delay: 1.5s; }
        .card-hearts span:nth-child(5) { bottom: 7%;  left: 12%; font-size: 22px; animation-delay: 7s; }
        .card-hearts span:nth-child(6) { top: 68%; right: 14%; font-size: 28px; animation-delay: 3.5s; }

        @keyframes floatHeartCard {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg);         opacity: 0.11; }
            30%      { transform: translateY(-14px) scale(1.12) rotate(6deg);  opacity: 0.18; }
            60%      { transform: translateY(-6px) scale(0.94) rotate(-4deg);  opacity: 0.13; }
            85%      { transform: translateY(-20px) scale(1.06) rotate(8deg);  opacity: 0.21; }
        }

        /* Контент всегда поверх сердечек внутри плашки */
        .card > *:not(.card-hearts) {
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 14px;
            color: #8b5e5e;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            font-family: 'Comfortaa', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab-text {
            font-size: 0.8em;
        }

        .tab.active {
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 100%);
            color: white;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 6px 20px rgba(139, 94, 94, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-content.active {
            display: block;
        }

        .filters {
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b5e5e;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 20px;
            color: #8b5e5e;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85em;
            font-weight: 500;
            font-family: 'Comfortaa', cursive;
            white-space: nowrap;
        }

        .filter-btn.selected {
            background: linear-gradient(135deg, #ffc4d0 0%, #ffb3c6 100%);
            border-color: #d4a5a5;
            color: #6b4545;
            box-shadow: 
                0 4px 15px rgba(212, 165, 165, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .jar-container {
            position: relative;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0 20px 0;
            /* Высота горлышка банки относительно её центра на экране.
               Посчитано по геометрии сцены Three.js: крышка стоит на y = 2.32,
               камера с z = 8 и углом 45° показывает 6.63 юнита по высоте,
               а контейнер занимает 400px → 2.32 * 400 / 6.63 ≈ 140px. */
            --note-lift: 140px;
        }

        #jar-canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .note-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 94%;
            max-width: 310px;
            min-height: 160px;
            background: linear-gradient(135deg, #fff9f0 0%, #fff5e6 100%);
            border: 2px solid #d4a5a5;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            text-align: center;
            color: #8b5e5e;
            font-size: 1.1em;
            line-height: 1.5;
            font-weight: 500;
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.8);
            font-family: 'Caveat', cursive;
            z-index: 5;
            pointer-events: none;
            max-height: 100%;
            overflow-y: auto;
        }

        /* Длинные идеи — чуть мельче, чтобы целиком помещались в банку */
        .note-overlay.medium-text { font-size: 1em; }
        .note-overlay.long-text   { font-size: 0.9em; line-height: 1.42; }
        .note-overlay.short-text  { font-size: 1.25em; }

        .note-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 1px,
                    rgba(212, 165, 165, 0.03) 2px,
                    rgba(212, 165, 165, 0.03) 3px
                );
            border-radius: 12px;
            pointer-events: none;
        }

        .note-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 20px 20px 0;
            border-color: transparent #f0d5d0 transparent transparent;
            border-radius: 0 0 0 3px;
        }

        /* Спрятанная записка лежит в горлышке банки: узкая полоска бумаги,
           чуть повёрнутая набок. */
        .note-overlay.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) translateY(calc(-1 * var(--note-lift))) scale(0.18) rotate(-12deg);
            pointer-events: none;
            /* при повторном вытягивании старая записка втягивается обратно в банку */
            transition: transform 0.18s ease-in, opacity 0.14s ease-in;
        }

        .note-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            animation: notePull 0.75s cubic-bezier(0.33, 0, 0.2, 1);
            pointer-events: auto;
            will-change: transform, opacity;
            transform-origin: 50% 30%;
        }

        /* Лист разворачивается из свитка, который 3D-сцена только что
           вытащила из банки и поднесла к экрану (≈750 мс):
           0–18%  — узкая полоска на месте свитка, у горлышка;
           18–50% — раскручивается по горизонтали, слегка поворачиваясь;
           50–80% — раскрывается по высоте и опускается в центр;
           80–100% — мягко ложится с крошечным перелётом. */
        @keyframes notePull {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(calc(-0.62 * var(--note-lift))) scale(0.22, 0.06) rotate(-10deg);
                animation-timing-function: cubic-bezier(0.25, 0.6, 0.3, 1);
            }
            18% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(calc(-0.6 * var(--note-lift))) scale(0.42, 0.07) rotate(-6deg);
                animation-timing-function: cubic-bezier(0.3, 0.5, 0.35, 1);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(calc(-0.42 * var(--note-lift))) scale(1.02, 0.16) rotate(4deg);
                animation-timing-function: cubic-bezier(0.35, 0.1, 0.3, 1);
            }
            80% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(8px) scale(1.03, 1.05) rotate(-1.5deg);
                animation-timing-function: ease-out;
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0) scale(1) rotate(0deg);
            }
        }

        /* Кнопка на время вытягивания — чтобы не жали повторно */
        .randomize-btn.drawing {
            opacity: 0.75;
            pointer-events: none;
            transform: scale(0.98);
        }

        .note-text {
            margin-bottom: 8px;
        }

        .remove-idea-btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, #cc9999 0%, #b88989 100%);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 0.75em;
            font-family: 'Comfortaa', cursive;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 6px;
            pointer-events: auto;
            box-shadow: 0 3px 10px rgba(139, 94, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .remove-idea-btn.hidden {
            display: none;
        }

        .randomize-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 50%, #b88989 100%);
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 6px 25px rgba(139, 94, 94, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            font-family: 'Comfortaa', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .randomize-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.3);
        }

        .custom-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .custom-input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #f0e0e0;
            border-radius: 14px;
            font-size: 0.95em;
            color: #8b5e5e;
            font-family: 'Comfortaa', cursive;
            transition: all 0.3s;
            background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        }

        .custom-input:focus {
            outline: none;
            border-color: #d4a5a5;
            box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.1);
        }

        .add-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #d4a5a5 0%, #b88989 100%);
            border: none;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1em;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.25);
        }

        .delete-btn {
            background: linear-gradient(135deg, #cc9999 0%, #b88989 100%);
            padding: 8px 12px;
            font-size: 0.85em;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 3px 10px rgba(139, 94, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restore-btn {
            background: linear-gradient(135deg, #90d490 0%, #70b070 100%);
            padding: 8px 12px;
            font-size: 0.85em;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 3px 10px rgba(70, 140, 70, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .custom-list, .history-list {
            list-style: none;
        }

        .custom-item, .history-item {
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8b5e5e;
            border: 1px solid rgba(212, 165, 165, 0.2);
            font-size: 0.9em;
        }

        .history-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            gap: 10px;
        }

        .history-item-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9em;
        }

        .history-item-date {
            font-size: 0.8em;
            color: #a07878;
            opacity: 0.8;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 0.8em;
            white-space: nowrap;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #d4a5a5;
        }

        .history-item.completed {
            opacity: 0.5;
            filter: grayscale(0.3);
        }

        .history-item.completed .history-item-title {
            text-decoration: line-through;
        }

        .empty-message {
            text-align: center;
            color: #a07878;
            padding: 30px 15px;
            font-style: italic;
            opacity: 0.7;
            font-size: 0.9em;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 14px;
            color: #8b5e5e;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-family: 'Comfortaa', cursive;
            font-size: 0.9em;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ffc4d0 0%, #ffb3c6 100%);
            border-color: #d4a5a5;
            box-shadow: 0 4px 15px rgba(212, 165, 165, 0.3);
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 0.85em;
            }

            .card {
                padding: 15px;
                border-radius: 20px;
            }

            .jar-container {
                height: 360px;
                margin: 20px 0 15px 0;
                /* банка ниже на 40px — горлышко тоже ближе к центру */
                --note-lift: 126px;
            }

            .note-overlay {
                font-size: 1em;
                padding: 16px;
                min-height: 140px;
            }

            .filter-btn {
                padding: 8px 14px;
                font-size: 0.8em;
            }

            .tab {
                min-width: 70px;
                padding: 10px 6px;
                font-size: 0.8em;
            }

            .randomize-btn {
                font-size: 1em;
                padding: 14px;
            }
        }

        /* Уважаем системную настройку «уменьшить движение» */
        @media (prefers-reduced-motion: reduce) {
            .heart-decoration,
            .card-hearts span {
                animation: none;
            }

            /* без покадровой анимации записка просто появляется на месте */
            .note-overlay.show {

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="date_ideas.js"></script>
    <script>
        let filters = {
            budget: 'all',
            location: 'all',
            mood: 'all',
            season: 'all'
        };
        let currentMode = 'preset';
        let currentIdeaId = null;
        let customIdeas = JSON.parse(localStorage.getItem('customIdeas')) || [];
        let history = JSON.parse(localStorage.getItem('dateHistory')) || [];
        let removedIdeas = JSON.parse(localStorage.getItem('removedIdeas')) || [];

        let scene, camera, renderer, jarGroup;
        // Для анимации вытягивания: крышка, свиток, свет, искры, записки внутри
        let lidGroup, pullScroll, scrollMaterials = [], innerLight, neckGlow;
        let sparkles = null, jarNotes = [];
        const LID_BASE_Y = 2.16;
        let mouseX = 0, mouseY = 0, touchX = 0, touchY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        function initThreeJS() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ 
                canvas: container, 
                alpha: true, 
                antialias: true 
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
            directionalLight1.position.set(5, 10, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffd4d8, 0.45);
            directionalLight2.position.set(-5, -5, 5);
            scene.add(directionalLight2);

            // Тёплый свет изнутри — чтобы записки читались через стекло
            innerLight = new THREE.PointLight(0xfff0e0, 0.6, 12);
            innerLight.position.set(0, 0.5, 0);
            scene.add(innerLight);

            // ===== ВСЯ БАНКА В ОДНОЙ ГРУППЕ =====
            // Крышка, ручка, корпус, дно и записки — дети одной группы,
            // поэтому вращаются как единое целое и не распадаются.
            jarGroup = new THREE.Group();
            scene.add(jarGroup);

            // --- корпус ---
            const jarGeometry = new THREE.CylinderGeometry(1.5, 1.5, 4, 48, 1, true);
            const jarMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xfff5f0,
                metalness: 0.05,
                roughness: 0.08,
                transparent: true,
                opacity: 0.2,
                transmission: 0.6,
                thickness: 0.3,
                envMapIntensity: 1,
                clearcoat: 1,
                clearcoatRoughness: 0.05,
                side: THREE.DoubleSide,
                depthWrite: false      // стекло не перекрывает записки внутри
            });
            const jar = new THREE.Mesh(jarGeometry, jarMaterial);
            jar.position.y = 0;
            jarGroup.add(jar);

            // тонкий контур — тоже внутри группы
            const edgeGeometry = new THREE.EdgesGeometry(jarGeometry);
            const edgeMaterial = new THREE.LineBasicMaterial({ 
                color: 0xd4a5a5, 
                linewidth: 2,
                transparent: true,
                opacity: 0.28
            });
            jarGroup.add(new THREE.LineSegments(edgeGeometry, edgeMaterial));

            // --- дно ---
            const bottomGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.15, 48);
            const bottomMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xf5e8e8,
                transparent: true,
                opacity: 0.55,
                metalness: 0.05,
                roughness: 0.25
            });
            const bottom = new THREE.Mesh(bottomGeometry, bottomMaterial);
            bottom.position.y = -2;
            jarGroup.add(bottom);

            // --- крышка ---
            const lidMaterial = new THREE.MeshPhongMaterial({
                color: 0xc98d8d,
                shininess: 45,
                specular: 0x777777
            });
            // Крышка — отдельная группа, чтобы её можно было открутить и снять
            lidGroup = new THREE.Group();
            lidGroup.position.y = LID_BASE_Y;
            lidGroup.rotation.order = 'ZXY';   // сначала вращение вокруг своей оси, потом наклон
            jarGroup.add(lidGroup);

            const lid = new THREE.Mesh(
                new THREE.CylinderGeometry(1.24, 1.32, 0.32, 48),
                lidMaterial
            );
            lidGroup.add(lid);

            // рифление по краю — без него поворот гладкой крышки незаметен
            const ribGeometry = new THREE.BoxGeometry(0.05, 0.24, 0.05);
            const ribMaterial = new THREE.MeshPhongMaterial({ color: 0xb87c7c, shininess: 30 });
            const RIBS = 32;
            for (let i = 0; i < RIBS; i++) {
                const a = (i / RIBS) * Math.PI * 2;
                const rib = new THREE.Mesh(ribGeometry, ribMaterial);
                rib.position.set(Math.cos(a) * 1.29, 0, Math.sin(a) * 1.29);
                rib.rotation.y = -a;
                lidGroup.add(rib);
            }

            // --- ручка на крышке ---
            const knob = new THREE.Mesh(
                new THREE.CylinderGeometry(0.22, 0.27, 0.28, 24),
                lidMaterial
            );
            knob.position.y = 0.30;
            lidGroup.add(knob);

            // светлый уплотнитель снизу — виден, когда крышку приподнимают
            const seal = new THREE.Mesh(
                new THREE.CircleGeometry(1.2, 48),
                new THREE.MeshStandardMaterial({ color: 0xf6e1da, roughness: 0.8, side: THREE.DoubleSide })
            );
            seal.rotation.x = Math.PI / 2;
            seal.position.y = -0.165;
            lidGroup.add(seal);

            // кольцо горлышка — показывается, когда крышка снята
            const rim = new THREE.Mesh(
                new THREE.TorusGeometry(1.47, 0.045, 10, 64),
                new THREE.MeshPhongMaterial({ color: 0xe8c4c4, transparent: true, opacity: 0.75, shininess: 60 })
            );
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 1.98;
            jarGroup.add(rim);

            // --- записки внутри ---
            // Одна геометрия на все записки + несколько материалов = дёшево для телефона
            const noteGeometry = new THREE.BoxGeometry(0.5, 0.045, 0.36);
            const noteColors = [0xfffaf0, 0xfff3e2, 0xffeaea, 0xf9e2e2, 0xfff6dd, 0xfdf0f0];
            const noteMaterials = noteColors.map(c => new THREE.MeshStandardMaterial({
                color: c,
                roughness: 0.9,
                metalness: 0.0
            }));

            const NOTES_COUNT = 55;
            for (let i = 0; i < NOTES_COUNT; i++) {
                const note = new THREE.Mesh(
                    noteGeometry,
                    noteMaterials[i % noteMaterials.length]
                );

                // Раскладываем по объёму банки: радиус до 1.1 (стенка на 1.5),
                // по высоте — с уклоном вниз, как будто банка уже наполовину полна
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.sqrt(Math.random()) * 1.1;
                const heightBias = Math.pow(Math.random(), 1.5);   // 0 = низ, 1 = верх
                const y = -1.78 + heightBias * 3.4;

                note.position.set(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );

                // Случайный поворот — записки лежат вразнобой, а не ровным штабелем
                note.rotation.set(
                    (Math.random() - 0.5) * Math.PI * 0.9,
                    Math.random() * Math.PI * 2,
                    (Math.random() - 0.5) * Math.PI * 0.9
                );

                note.userData.base = {
                    y: note.position.y,
                    rx: note.rotation.x,
                    rz: note.rotation.z
                };
                jarNotes.push(note);
                jarGroup.add(note);
            }

            createDrawEffects();

            // --- блик на стекле: тонкая вертикальная полоса ---
            const gloss = new THREE.Mesh(
                new THREE.PlaneGeometry(0.28, 3.4),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.16,
                    depthWrite: false
                })
            );
            gloss.position.set(-0.78, 0.1, 1.18);
            gloss.rotation.y = Math.PI * 0.12;
            jarGroup.add(gloss);

            container.addEventListener('touchstart', onTouchStart, { passive: true });
            container.addEventListener('touchmove', onTouchMove, { passive: true });
            container.addEventListener('touchend', onTouchEnd, { passive: true });
            container.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onTouchStart(event) {
            if (event.touches.length > 0) {
                const rect = event.target.getBoundingClientRect();
                touchX = event.touches[0].clientX;
                touchY = event.touches[0].clientY;
            }
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                const rect = event.target.getBoundingClientRect();
                const newTouchX = event.touches[0].clientX;
                const newTouchY = event.touches[0].clientY;
                
                const deltaX = (newTouchX - touchX) / rect.width;
                const deltaY = (newTouchY - touchY) / rect.height;
                
                targetRotationY += deltaX * 2;
                targetRotationX += deltaY * 1;
                
                touchX = newTouchX;
                touchY = newTouchY;
            }
        }

        function onTouchEnd(event) {
            // Keep current rotation
        }

        function onMouseMove(event) {
            const rect = event.target.getBoundingClientRect();
            mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            targetRotationY = mouseX * 0.3;
            targetRotationX = mouseY * 0.2;
        }

        function onWindowResize() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Вращаем всю группу целиком — банка остаётся цельной
            const now = performance.now();
            // Во время вытягивания банка мягко выпрямляется к камере
            const tiltTarget = drawState ? 0 : targetRotationX;
            jarGroup.rotation.y += (targetRotationY - jarGroup.rotation.y) * 0.05;
            jarGroup.rotation.x += (tiltTarget - jarGroup.rotation.x) * 0.05;

            updateDrawSequence(now);
            updateJarShake(now);
            updateSparkles(now);

            // Медленное автоматическое вращение
            jarGroup.rotation.y += 0.001;

            renderer.render(scene, camera);
        }


        // =====================================================================
        //  АНИМАЦИЯ ВЫТЯГИВАНИЯ: банка вздрагивает → крышка откручивается и
        //  снимается → из горлышка поднимается свёрнутая записка → летит к
        //  экрану и разворачивается в лист → крышка закручивается обратно.
        //  Всё считается от времени (без накопления), поэтому не «плывёт»
        //  при просадках FPS на слабых телефонах.
        // =====================================================================
        let drawState = null;           // { start, onReveal, revealed }
        const DRAW = {
            shake:      [0, 320],       // банка вздрагивает
            twist:      [180, 760],     // крышку откручивают
            liftAside:  [700, 1120],    // поднимают и отводят в сторону
            glow:       [760, 1100],    // из горлышка пробивается свет
            scrollIn:   [880, 1480],    // свиток поднимается из банки
            scrollFly:  [1480, 1760],   // свиток летит к экрану
            reveal:     1640,           // свиток долетел — разворачивается бумажный лист (DOM)
            close:      [2080, 2680],   // крышка возвращается на место
            end:        2700
        };

        const clamp01 = v => Math.min(1, Math.max(0, v));
        const phase = (t, [a, b]) => clamp01((t - a) / (b - a));
        const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const easeOut = p => 1 - Math.pow(1 - p, 3);
        const easeIn = p => p * p * p;
        const easeOutBack = p => { const c = 1.5; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

        function makeGlowTexture(inner, outer) {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, inner);
            grad.addColorStop(0.35, outer);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        function createDrawEffects() {
            // --- свёрнутая записка-свиток (живёт в сцене, а не в банке,
            //     чтобы не крутиться вместе с ней) ---
            pullScroll = new THREE.Group();
            const paperMat = new THREE.MeshStandardMaterial({
                color: 0xfff6ea, roughness: 0.85, transparent: true, opacity: 0
            });
            const edgeMat = new THREE.MeshStandardMaterial({
                color: 0xf1d9cc, roughness: 0.9, transparent: true, opacity: 0
            });
            const ribbonMat = new THREE.MeshPhongMaterial({
                color: 0xd98b9b, shininess: 60, transparent: true, opacity: 0
            });
            scrollMaterials = [paperMat, edgeMat, ribbonMat];

            const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.9, 24), paperMat);
            pullScroll.add(roll);
            // торцы свитка чуть темнее — видно, что это рулончик бумаги
            [0.452, -0.452].forEach(y => {
                const cap = new THREE.Mesh(new THREE.CircleGeometry(0.15, 24), edgeMat);
                cap.rotation.x = y > 0 ? -Math.PI / 2 : Math.PI / 2;
                cap.position.y = y;
                pullScroll.add(cap);
            });
            // хвостик бумаги, который отходит от рулона
            const flap = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.86),
                new THREE.MeshStandardMaterial({ color: 0xfff6ea, roughness: 0.85,
                    transparent: true, opacity: 0, side: THREE.DoubleSide }));
            scrollMaterials.push(flap.material);
            flap.position.set(0.2, 0, 0.06);
            flap.rotation.y = -0.5;
            pullScroll.add(flap);
            // розовая ленточка с бантиком
            const ribbon = new THREE.Mesh(new THREE.TorusGeometry(0.158, 0.03, 8, 32), ribbonMat);
            ribbon.rotation.x = Math.PI / 2;
            pullScroll.add(ribbon);
            [-1, 1].forEach(side => {
                const bow = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.022, 8, 20), ribbonMat);
                bow.position.set(side * 0.07, 0, 0.17);
                bow.scale.set(1, 0.6, 1);
                pullScroll.add(bow);
            });
            pullScroll.visible = false;
            scene.add(pullScroll);

            // --- свечение из горлышка ---
            neckGlow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: makeGlowTexture('rgba(255,244,220,1)', 'rgba(255,214,170,0.55)'),
                transparent: true, opacity: 0, depthWrite: false
            }));
            neckGlow.scale.set(3.6, 2.2, 1);
            neckGlow.position.set(0, 2.25, 0.2);
            scene.add(neckGlow);

            // --- искорки, которые вылетают вслед за запиской ---
            const COUNT = 46;
            const positions = new Float32Array(COUNT * 3);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const seeds = [];
            for (let i = 0; i < COUNT; i++) {
                seeds.push({
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.9 + Math.random() * 1.6,
                    spread: 0.4 + Math.random() * 1.3,
                    delay: Math.random() * 0.35,
                    life: 0.7 + Math.random() * 0.6
                });
            }
            sparkles = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 0.16,
                map: makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,190,205,0.8)'),
                color: 0xffc4d4,
                transparent: true, opacity: 0, depthWrite: false, sizeAttenuation: true
            }));
            sparkles.userData = { seeds, start: -1 };
            sparkles.visible = false;
            scene.add(sparkles);
        }

        function startDrawSequence(onReveal) {
            drawState = { start: performance.now(), onReveal, revealed: false };
            document.querySelector('.randomize-btn').classList.add('drawing');
            haptic('medium');
        }

        function haptic(kind) {
            try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(kind); } catch (e) {}
        }

        function updateDrawSequence(now) {
            if (!drawState || !lidGroup) return;
            const t = now - drawState.start;

            // ---------- крышка ----------
            const tw = easeInOut(phase(t, DRAW.twist));
            const la = easeOutBack(phase(t, DRAW.liftAside));
            const cl = easeInOut(phase(t, DRAW.close));
            const open = 1 - cl;                 // 1 — крышка снята, 0 — на месте

            // откручиваем ~0.4 оборота; при закрытии крышка сначала садится
            // на горлышко, а потом плавно закручивается обратно
            const screwBack = easeInOut(phase(t, [DRAW.close[0] + 260, DRAW.close[1]]));
            lidGroup.rotation.y = -tw * 2.6 * (1 - screwBack);
            lidGroup.position.y = LID_BASE_Y + (tw * 0.12 + la * 0.42) * open;
            lidGroup.position.x = la * 1.55 * open;
            lidGroup.position.z = la * 0.25 * open;
            lidGroup.rotation.z = -la * 0.62 * open;
            lidGroup.rotation.x = la * 0.18 * open;

            // ---------- свет из горлышка ----------
            const glowIn = easeOut(phase(t, DRAW.glow));
            const glowOut = phase(t, [1700, 2150]);
            const glow = glowIn * (1 - glowOut);
            neckGlow.material.opacity = glow * (0.85 + Math.sin(t / 70) * 0.08);
            neckGlow.scale.set(3.2 + glow * 0.6, 1.8 + glow * 0.5, 1);
            innerLight.intensity = 0.6 + glow * 1.4;

            // ---------- свиток ----------
            const si = phase(t, DRAW.scrollIn);
            const sf = phase(t, DRAW.scrollFly);
            pullScroll.visible = t >= DRAW.scrollIn[0] && sf < 1;
            if (pullScroll.visible) {
                const rise = easeOut(si);
                const fly = easeInOut(sf);
                pullScroll.position.set(
                    Math.sin(si * Math.PI) * 0.12,              // лёгкое покачивание при подъёме
                    0.4 + rise * 2.35 - fly * 1.9,
                    fly * 3.4
                );
                pullScroll.rotation.set(
                    fly * 1.25,                                 // наклоняется к зрителю
                    rise * Math.PI * 1.6,                       // проворачивается, пока тянут
                    Math.sin(si * Math.PI * 2) * 0.22 * (1 - fly) - 0.12
                );
                const s = 1 + fly * 0.5;
                pullScroll.scale.set(s, s, s);
                const alpha = clamp01(si * 5) * (1 - clamp01((sf - 0.35) / 0.65));
                scrollMaterials.forEach(m => m.opacity = alpha);
            }

            // искры стартуют, когда свиток показывается над горлышком
            if (sparkles.userData.start < 0 && t >= 1180) {
                sparkles.userData.start = now;
                sparkles.visible = true;
                haptic('light');
            }

            // ---------- бумажный лист ----------
            if (!drawState.revealed && t >= DRAW.reveal) {
                drawState.revealed = true;
                drawState.onReveal && drawState.onReveal();
            }

            if (t >= DRAW.end) finishDrawSequence();
        }

        function finishDrawSequence() {
            if (lidGroup) {
                lidGroup.position.set(0, LID_BASE_Y, 0);
                lidGroup.rotation.set(0, 0, 0);
            }
            if (pullScroll) pullScroll.visible = false;
            if (neckGlow) neckGlow.material.opacity = 0;
            if (innerLight) innerLight.intensity = 0.6;
            jarGroup.position.set(0, 0, 0);
            jarGroup.rotation.z = 0;
            jarNotes.forEach(n => {
                n.position.y = n.userData.base.y;
                n.rotation.x = n.userData.base.rx;
                n.rotation.z = n.userData.base.rz;
            });
            if (drawState && !drawState.revealed && drawState.onReveal) drawState.onReveal();
            drawState = null;
            document.querySelector('.randomize-btn').classList.remove('drawing');
        }

        // Банка вздрагивает перед открытием, записки внутри шуршат,
        // а пока свиток вытягивают — верхние записки тянутся следом.
        function updateJarShake(now) {
            if (!drawState) return;
            const t = now - drawState.start;

            const sh = phase(t, DRAW.shake);
            const shakeAmp = sh < 1 ? Math.sin(sh * Math.PI) : 0;
            jarGroup.position.x = Math.sin(t / 26) * 0.06 * shakeAmp;
            jarGroup.rotation.z = Math.sin(t / 34) * 0.035 * shakeAmp;
            // после закрытия крышки — маленький «приземляющийся» прыжок
            const land = phase(t, [DRAW.close[1] - 120, DRAW.end]);
            jarGroup.position.y = land > 0 && land < 1 ? Math.sin(land * Math.PI) * -0.04 : 0;

            const rustle = shakeAmp + Math.sin(phase(t, DRAW.scrollIn) * Math.PI) * 0.7;
            jarNotes.forEach((n, i) => {
                const b = n.userData.base;
                const topness = clamp01((b.y + 0.2) / 1.6);   // верхние шевелятся сильнее
                n.position.y = b.y + Math.abs(Math.sin(t / 60 + i)) * 0.07 * rustle * topness;
                n.rotation.x = b.rx + Math.sin(t / 45 + i * 1.7) * 0.18 * rustle;
                n.rotation.z = b.rz + Math.cos(t / 52 + i * 1.3) * 0.18 * rustle;
            });
        }

        function updateSparkles(now) {
            if (!sparkles || sparkles.userData.start < 0) return;
            const t = (now - sparkles.userData.start) / 1000;
            const pos = sparkles.geometry.attributes.position.array;
            let alive = 0;
            sparkles.userData.seeds.forEach((sd, i) => {
                const lt = clamp01((t - sd.delay) / sd.life);
                const r = sd.spread * easeOut(lt);
                pos[i * 3]     = Math.cos(sd.angle) * r;
                pos[i * 3 + 1] = 2.2 + sd.speed * easeOut(lt) * 0.9 - lt * lt * 0.4;
                pos[i * 3 + 2] = Math.sin(sd.angle) * r * 0.6 + 0.4;
                if (lt < 1) alive++;
            });
            sparkles.geometry.attributes.position.needsUpdate = true;
            sparkles.material.opacity = clamp01(t * 6) * clamp01(1.4 - t);
            if (alive === 0 || t > 1.6) {
                sparkles.visible = false;
                sparkles.userData.start = -1;
            }
        }

        // Пустая банка / нет идей: банка просто вздрагивает, крышка не открывается
        function nudgeJar() {
            if (!jarGroup) return;
            const start = performance.now();
            haptic('rigid');
            (function wobble() {
                const p = (performance.now() - start) / 420;
                if (p >= 1 || drawState) { if (!drawState) { jarGroup.position.x = 0; jarGroup.rotation.z = 0; } return; }
                const a = Math.sin(p * Math.PI);
                jarGroup.position.x = Math.sin(p * 40) * 0.07 * a;
                jarGroup.rotation.z = Math.sin(p * 32) * 0.04 * a;
                requestAnimationFrame(wobble);
            })();
        }

        const prefersReducedMotion = () =>
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const filterType = e.target.dataset.filter;
                    const value = e.target.dataset.value;
                    
                    document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(b => {
                        b.classList.remove('selected');
                    });
                    
                    e.target.classList.add('selected');
                    filters[filterType] = value;
                });
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('preset-filters').style.display = mode === 'preset' ? 'block' : 'none';
        }

        function showNote(note) {
            // перезапуск CSS-анимации листа, даже если класс уже стоит
            note.classList.remove('show');
            note.classList.remove('hidden');
            void note.offsetWidth;
            note.classList.add('show');
        }

        function randomize() {
            // пока банка открыта и записку тянут — повторные нажатия игнорируем
            if (drawState) return;

            const note = document.getElementById('note');
            const noteText = document.getElementById('note-text');
            const removeBtn = document.getElementById('remove-btn');
            let selectedDate, selectedId;

            if (currentMode === 'preset') {
                let filteredIdeas = dateIdeas.filter(idea => {
                    if (removedIdeas.includes(idea.id)) return false;

                    return (filters.budget === 'all' || idea.budget === filters.budget) &&
                           (filters.location === 'all' || idea.location === filters.location) &&
                           (filters.mood === 'all' || idea.mood === filters.mood) &&
                           (filters.season === 'all' || idea.season === 'any' || idea.season === filters.season);
                });

                if (filteredIdeas.length === 0) {
                    noteText.textContent = 'Нет идей с такими фильтрами';
                    removeBtn.classList.add('hidden');
                    showNote(note);
                    nudgeJar();
                    return;
                }

                const selected = filteredIdeas[Math.floor(Math.random() * filteredIdeas.length)];
                selectedDate = selected.title;
                selectedId = selected.id;
            } else {
                if (customIdeas.length === 0) {
                    noteText.textContent = 'Добавьте свои идеи на вкладке "Свои идеи"';
                    removeBtn.classList.add('hidden');
                    showNote(note);
                    nudgeJar();
                    return;
                }
                selectedDate = customIdeas[Math.floor(Math.random() * customIdeas.length)];
                selectedId = null;
            }

            currentIdeaId = selectedId;

            // предыдущая записка «ныряет» обратно в банку
            note.classList.remove('show');
            note.classList.add('hidden');

            const reveal = () => {
                noteText.textContent = selectedDate;
                // Подбираем кегль под длину идеи, чтобы текст поместился в банку
                note.classList.remove('short-text', 'medium-text', 'long-text');
                if (selectedDate.length > 190) {
                    note.classList.add('long-text');
                } else if (selectedDate.length > 120) {
                    note.classList.add('medium-text');
                } else {
                    note.classList.add('short-text');
                }
                if (selectedId !== null) {
                    removeBtn.classList.remove('hidden');
                } else {
                    removeBtn.classList.add('hidden');
                }
                showNote(note);
                addToHistory(selectedDate);
            };

            if (prefersReducedMotion() || !lidGroup) {
                // без анимаций — как раньше, просто показываем записку
                setTimeout(reveal, 200);
            } else {
                startDrawSequence(reveal);
            }
        }

        function removeCurrentIdea() {
            if (currentIdeaId !== null && !removedIdeas.includes(currentIdeaId)) {
                removedIdeas.push(currentIdeaId);
                localStorage.setItem('removedIdeas', JSON.stringify(removedIdeas));
                
                const note = document.getElementById('note');
                const noteText = document.getElementById('note-text');
                const removeBtn = document.getElementById('remove-btn');
                
                noteText.textContent = 'Идея удалена. Найдите её во вкладке "Удалённые"';
                removeBtn.classList.add('hidden');
                
                currentIdeaId = null;
                renderRemovedList();
            }
        }

        function addCustomIdea() {
            const input = document.getElementById('custom-idea-input');
            const idea = input.value.trim();
            
            if (idea) {
                customIdeas.push(idea);
                localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
                input.value = '';
                renderCustomList();
            }
        }

        function renderCustomList() {
            const list = document.getElementById('custom-list');
            const empty = document.getElementById('custom-empty');
            
            if (customIdeas.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = customIdeas.map((idea, index) => `
                    <li class="custom-item">
                        <span>${idea}</span>
                        <button class="delete-btn" onclick="deleteCustomIdea(${index})">
                            <svg class="icon"><use href="#icon-trash"/></svg>
                        </button>
                    </li>
                `).join('');
            }
        }

        function deleteCustomIdea(index) {
            customIdeas.splice(index, 1);
            localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
            renderCustomList();
        }

        function addToHistory(dateTitle) {
            const historyItem = {
                id: Date.now(),
                title: dateTitle,
                date: new Date().toLocaleDateString('ru-RU'),
                completed: false
            };
            
            history.unshift(historyItem);
            if (history.length > 50) history = history.slice(0, 50);
            localStorage.setItem('dateHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const empty = document.getElementById('history-empty');
            
            if (history.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = history.map(item => `
                    <li class="history-item ${item.completed ? 'completed' : ''}">
                        <div class="history-item-header">
                            <div>
                                <div class="history-item-title">${item.title}</div>
                                <div class="history-item-date">${item.date}</div>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} 
                                       onchange="toggleCompleted(${item.id})">
                                <span>✓</span>
                            </label>
                        </div>
                    </li>
                `).join('');
            }
        }

        function toggleCompleted(id) {
            const item = history.find(h => h.id === id);
            if (item) {
                item.completed = !item.completed;
                localStorage.setItem('dateHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderRemovedList() {
            const list = document.getElementById('removed-list');
            const empty = document.getElementById('removed-empty');
            
            if (removedIdeas.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                
                const removedWithTitles = removedIdeas.map(id => {
                    const idea = dateIdeas.find(i => i.id === id);
                    return idea ? { id, title: idea.title } : null;
                }).filter(Boolean);
                
                list.innerHTML = removedWithTitles.map(item => `
                    <li class="custom-item">
                        <span>${item.title}</span>
                        <button class="restore-btn" onclick="restoreIdea(${item.id})">
                            <svg class="icon"><use href="#icon-sparkles"/></svg>
                        </button>
                    </li>
                `).join('');
            }
        }

        function restoreIdea(ideaId) {
            removedIdeas = removedIdeas.filter(id => id !== ideaId);
            localStorage.setItem('removedIdeas', JSON.stringify(removedIdeas));
            renderRemovedList();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            setupFilters();
            renderCustomList();
            renderHistory();
            renderRemovedList();
            
            document.getElementById('custom-idea-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addCustomIdea();
                }
            });
        });
    </script>
</body>
</html>
