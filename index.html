    <script>
        let filters = {
            budget: 'all',
            location: 'all',
            mood: 'all',
            season: 'all'
        };
        let currentMode = 'preset';
        let currentIdeaId = null;
        let customIdeas = JSON.parse(localStorage.getItem('customIdeas')) || [];
        let history = JSON.parse(localStorage.getItem('dateHistory')) || [];
        let removedIdeas = JSON.parse(localStorage.getItem('removedIdeas')) || [];

        let scene, camera, renderer, jarGroup;
        // Для анимации вытягивания: крышка, свиток, свет, искры, записки внутри
        let lidGroup, pullScroll, scrollMaterials = [], innerLight, neckGlow;
        let sparkles = null, jarNotes = [];
        const LID_BASE_Y = 2.16;

        // Одна WebGL-сцена на обе вкладки: банка и подарок — две модели в jarGroup,
        // видна только активная. Канвас и записка переезжают между вкладками.
        let jarModel = null, giftModel = null, jarLid = null, giftLid = null;
        let giftBowParts = [];
        let sceneMode = 'jar';
        const LID_MOTION = {
            // twist — поворот при откручивании, pop — подскок, ax/ay/az — куда уезжает,
            // rz/rx — наклон. У подарка крышку не откручивают, а снимают.
            jar:  { twist: 2.6, pop: 0.12, ax: 1.55, ay: 0.42, az: 0.25, rz: 0.62, rx: 0.18 },
            gift: { twist: 0.3, pop: 0.18, ax: 1.10, ay: 0.30, az: -1.50, rz: 0.30, rx: -0.50 }
        };
        let lidMotion = LID_MOTION.jar;
        let mouseX = 0, mouseY = 0, touchX = 0, touchY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        function initThreeJS() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ 
                canvas: container, 
                alpha: true, 
                antialias: true 
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
            directionalLight1.position.set(5, 10, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffd4d8, 0.45);
            directionalLight2.position.set(-5, -5, 5);
            scene.add(directionalLight2);

            // Тёплый свет изнутри — чтобы записки читались через стекло
            innerLight = new THREE.PointLight(0xfff0e0, 0.6, 12);
            innerLight.position.set(0, 0.5, 0);
            scene.add(innerLight);

            // ===== ВСЯ БАНКА В ОДНОЙ ГРУППЕ =====
            // Крышка, ручка, корпус, дно и записки — дети одной группы,
            // поэтому вращаются как единое целое и не распадаются.
            jarGroup = new THREE.Group();
            scene.add(jarGroup);
            jarModel = new THREE.Group();
            jarGroup.add(jarModel);

            // --- корпус ---
            const jarGeometry = new THREE.CylinderGeometry(1.5, 1.5, 4, 48, 1, true);
            const jarMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xfff5f0,
                metalness: 0.05,
                roughness: 0.08,
                transparent: true,
                opacity: 0.2,
                transmission: 0.6,
                thickness: 0.3,
                envMapIntensity: 1,
                clearcoat: 1,
                clearcoatRoughness: 0.05,
                side: THREE.DoubleSide,
                depthWrite: false      // стекло не перекрывает записки внутри
            });
            const jar = new THREE.Mesh(jarGeometry, jarMaterial);
            jar.position.y = 0;
            jarModel.add(jar);

            // тонкий контур — тоже внутри группы
            const edgeGeometry = new THREE.EdgesGeometry(jarGeometry);
            const edgeMaterial = new THREE.LineBasicMaterial({ 
                color: 0xd4a5a5, 
                linewidth: 2,
                transparent: true,
                opacity: 0.28
            });
            jarModel.add(new THREE.LineSegments(edgeGeometry, edgeMaterial));

            // --- дно ---
            const bottomGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.15, 48);
            const bottomMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xf5e8e8,
                transparent: true,
                opacity: 0.55,
                metalness: 0.05,
                roughness: 0.25
            });
            const bottom = new THREE.Mesh(bottomGeometry, bottomMaterial);
            bottom.position.y = -2;
            jarModel.add(bottom);

            // --- крышка ---
            const lidMaterial = new THREE.MeshPhongMaterial({
                color: 0xc98d8d,
                shininess: 45,
                specular: 0x777777
            });
            // Крышка — отдельная группа, чтобы её можно было открутить и снять
            lidGroup = new THREE.Group();
            lidGroup.position.y = LID_BASE_Y;
            lidGroup.rotation.order = 'ZXY';   // сначала вращение вокруг своей оси, потом наклон
            jarModel.add(lidGroup);

            const lid = new THREE.Mesh(
                new THREE.CylinderGeometry(1.24, 1.32, 0.32, 48),
                lidMaterial
            );
            lidGroup.add(lid);

            // рифление по краю — без него поворот гладкой крышки незаметен
            const ribGeometry = new THREE.BoxGeometry(0.05, 0.24, 0.05);
            const ribMaterial = new THREE.MeshPhongMaterial({ color: 0xb87c7c, shininess: 30 });
            const RIBS = 32;
            for (let i = 0; i < RIBS; i++) {
                const a = (i / RIBS) * Math.PI * 2;
                const rib = new THREE.Mesh(ribGeometry, ribMaterial);
                rib.position.set(Math.cos(a) * 1.29, 0, Math.sin(a) * 1.29);
                rib.rotation.y = -a;
                lidGroup.add(rib);
            }

            // --- ручка на крышке ---
            const knob = new THREE.Mesh(
                new THREE.CylinderGeometry(0.22, 0.27, 0.28, 24),
                lidMaterial
            );
            knob.position.y = 0.30;
            lidGroup.add(knob);

            // светлый уплотнитель снизу — виден, когда крышку приподнимают
            const seal = new THREE.Mesh(
                new THREE.CircleGeometry(1.2, 48),
                new THREE.MeshStandardMaterial({ color: 0xf6e1da, roughness: 0.8, side: THREE.DoubleSide })
            );
            seal.rotation.x = Math.PI / 2;
            seal.position.y = -0.165;
            lidGroup.add(seal);

            // кольцо горлышка — показывается, когда крышка снята
            const rim = new THREE.Mesh(
                new THREE.TorusGeometry(1.47, 0.045, 10, 64),
                new THREE.MeshPhongMaterial({ color: 0xe8c4c4, transparent: true, opacity: 0.75, shininess: 60 })
            );
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 1.98;
            jarModel.add(rim);

            // --- записки внутри ---
            // Одна геометрия на все записки + несколько материалов = дёшево для телефона
            const noteGeometry = new THREE.BoxGeometry(0.5, 0.045, 0.36);
            const noteColors = [0xfffaf0, 0xfff3e2, 0xffeaea, 0xf9e2e2, 0xfff6dd, 0xfdf0f0];
            const noteMaterials = noteColors.map(c => new THREE.MeshStandardMaterial({
                color: c,
                roughness: 0.9,
                metalness: 0.0
            }));

            const NOTES_COUNT = 55;
            for (let i = 0; i < NOTES_COUNT; i++) {
                const note = new THREE.Mesh(
                    noteGeometry,
                    noteMaterials[i % noteMaterials.length]
                );

                // Раскладываем по объёму банки: радиус до 1.1 (стенка на 1.5),
                // по высоте — с уклоном вниз, как будто банка уже наполовину полна
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.sqrt(Math.random()) * 1.1;
                const heightBias = Math.pow(Math.random(), 1.5);   // 0 = низ, 1 = верх
                const y = -1.78 + heightBias * 3.4;

                note.position.set(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );

                // Случайный поворот — записки лежат вразнобой, а не ровным штабелем
                note.rotation.set(
                    (Math.random() - 0.5) * Math.PI * 0.9,
                    Math.random() * Math.PI * 2,
                    (Math.random() - 0.5) * Math.PI * 0.9
                );

                note.userData.base = {
                    y: note.position.y,
                    rx: note.rotation.x,
                    rz: note.rotation.z
                };
                jarNotes.push(note);
                jarModel.add(note);
            }

            createDrawEffects();

            // --- блик на стекле: тонкая вертикальная полоса ---
            const gloss = new THREE.Mesh(
                new THREE.PlaneGeometry(0.28, 3.4),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.16,
                    depthWrite: false
                })
            );
            gloss.position.set(-0.78, 0.1, 1.18);
            gloss.rotation.y = Math.PI * 0.12;
            jarModel.add(gloss);

            jarLid = lidGroup;
            jarModel.userData.notes = jarNotes;
            if (window.NY_THEME) {
                addWinterToJar();
                buildGiftModel();
            }

            container.addEventListener('touchstart', onTouchStart, { passive: true });
            container.addEventListener('touchmove', onTouchMove, { passive: true });
            container.addEventListener('touchend', onTouchEnd, { passive: true });
            container.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onTouchStart(event) {
            if (event.touches.length > 0) {
                const rect = event.target.getBoundingClientRect();
                touchX = event.touches[0].clientX;
                touchY = event.touches[0].clientY;
            }
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                const rect = event.target.getBoundingClientRect();
                const newTouchX = event.touches[0].clientX;
                const newTouchY = event.touches[0].clientY;
                
                const deltaX = (newTouchX - touchX) / rect.width;
                const deltaY = (newTouchY - touchY) / rect.height;
                
                targetRotationY += deltaX * 2;
                targetRotationX += deltaY * 1;
                
                touchX = newTouchX;
                touchY = newTouchY;
            }
        }

        function onTouchEnd(event) {
            // Keep current rotation
        }

        function onMouseMove(event) {
            const rect = event.target.getBoundingClientRect();
            mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            targetRotationY = mouseX * 0.3;
            targetRotationX = mouseY * 0.2;
        }

        function onWindowResize() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;
            if (!width || !height) return;   // канвас во вкладке, которая сейчас скрыта
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Вращаем всю группу целиком — банка остаётся цельной
            const now = performance.now();
            // Во время вытягивания банка мягко выпрямляется к камере
            const tiltTarget = drawState ? 0 : targetRotationX;
            jarGroup.rotation.y += (targetRotationY - jarGroup.rotation.y) * 0.05;
            jarGroup.rotation.x += (tiltTarget - jarGroup.rotation.x) * 0.05;

            updateDrawSequence(now);
            updateJarShake(now);
            updateSparkles(now);

            // Медленное автоматическое вращение
            jarGroup.rotation.y += 0.001;

            renderer.render(scene, camera);
        }


        // =====================================================================
        //  АНИМАЦИЯ ВЫТЯГИВАНИЯ: банка вздрагивает → крышка откручивается и
        //  снимается → из горлышка поднимается свёрнутая записка → летит к
        //  экрану и разворачивается в лист → крышка закручивается обратно.
        //  Всё считается от времени (без накопления), поэтому не «плывёт»
        //  при просадках FPS на слабых телефонах.
        // =====================================================================
        let drawState = null;           // { start, onReveal, revealed }
        const DRAW = {
            shake:      [0, 320],       // банка вздрагивает
            twist:      [180, 760],     // крышку откручивают
            liftAside:  [700, 1120],    // поднимают и отводят в сторону
            glow:       [760, 1100],    // из горлышка пробивается свет
            scrollIn:   [880, 1480],    // свиток поднимается из банки
            scrollFly:  [1480, 1760],   // свиток летит к экрану
            reveal:     1640,           // свиток долетел — разворачивается бумажный лист (DOM)
            close:      [2080, 2680],   // крышка возвращается на место
            end:        2700
        };

        const clamp01 = v => Math.min(1, Math.max(0, v));
        const phase = (t, [a, b]) => clamp01((t - a) / (b - a));
        const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const easeOut = p => 1 - Math.pow(1 - p, 3);
        const easeIn = p => p * p * p;
        const easeOutBack = p => { const c = 1.5; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

        function makeGlowTexture(inner, outer) {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const g = c.getContext('2d');
            const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, inner);
            grad.addColorStop(0.35, outer);
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        function createDrawEffects() {
            // --- свёрнутая записка-свиток (живёт в сцене, а не в банке,
            //     чтобы не крутиться вместе с ней) ---
            pullScroll = new THREE.Group();
            const paperMat = new THREE.MeshStandardMaterial({
                color: 0xfff6ea, roughness: 0.85, transparent: true, opacity: 0
            });
            const edgeMat = new THREE.MeshStandardMaterial({
                color: 0xf1d9cc, roughness: 0.9, transparent: true, opacity: 0
            });
            const ribbonMat = new THREE.MeshPhongMaterial({
                color: 0xd98b9b, shininess: 60, transparent: true, opacity: 0
            });
            scrollMaterials = [paperMat, edgeMat, ribbonMat];

            const roll = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.9, 24), paperMat);
            pullScroll.add(roll);
            // торцы свитка чуть темнее — видно, что это рулончик бумаги
            [0.452, -0.452].forEach(y => {
                const cap = new THREE.Mesh(new THREE.CircleGeometry(0.15, 24), edgeMat);
                cap.rotation.x = y > 0 ? -Math.PI / 2 : Math.PI / 2;
                cap.position.y = y;
                pullScroll.add(cap);
            });
            // хвостик бумаги, который отходит от рулона
            const flap = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.86),
                new THREE.MeshStandardMaterial({ color: 0xfff6ea, roughness: 0.85,
                    transparent: true, opacity: 0, side: THREE.DoubleSide }));
            scrollMaterials.push(flap.material);
            flap.position.set(0.2, 0, 0.06);
            flap.rotation.y = -0.5;
            pullScroll.add(flap);
            // розовая ленточка с бантиком
            const ribbon = new THREE.Mesh(new THREE.TorusGeometry(0.158, 0.03, 8, 32), ribbonMat);
            ribbon.rotation.x = Math.PI / 2;
            pullScroll.add(ribbon);
            [-1, 1].forEach(side => {
                const bow = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.022, 8, 20), ribbonMat);
                bow.position.set(side * 0.07, 0, 0.17);
                bow.scale.set(1, 0.6, 1);
                pullScroll.add(bow);
            });
            pullScroll.visible = false;
            scene.add(pullScroll);

            // --- свечение из горлышка ---
            neckGlow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: makeGlowTexture('rgba(255,244,220,1)', 'rgba(255,214,170,0.55)'),
                transparent: true, opacity: 0, depthWrite: false
            }));
            neckGlow.scale.set(3.6, 2.2, 1);
            neckGlow.position.set(0, 2.25, 0.2);
            scene.add(neckGlow);

            // --- искорки, которые вылетают вслед за запиской ---
            const COUNT = 46;
            const positions = new Float32Array(COUNT * 3);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const seeds = [];
            for (let i = 0; i < COUNT; i++) {
                seeds.push({
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.9 + Math.random() * 1.6,
                    spread: 0.4 + Math.random() * 1.3,
                    delay: Math.random() * 0.35,
                    life: 0.7 + Math.random() * 0.6
                });
            }
            sparkles = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 0.16,
                map: makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,190,205,0.8)'),
                color: 0xffc4d4,
                transparent: true, opacity: 0, depthWrite: false, sizeAttenuation: true
            }));
            sparkles.userData = { seeds, start: -1 };
            sparkles.visible = false;
            scene.add(sparkles);
        }

        function startDrawSequence(onReveal) {
            drawState = { start: performance.now(), onReveal, revealed: false };
            document.querySelectorAll('.randomize-btn').forEach(b => b.classList.add('drawing'));
            haptic('medium');
        }

        function haptic(kind) {
            try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(kind); } catch (e) {}
        }

        function updateDrawSequence(now) {
            if (!drawState || !lidGroup) return;
            const t = now - drawState.start;

            // ---------- крышка ----------
            const tw = easeInOut(phase(t, DRAW.twist));
            const la = easeOutBack(phase(t, DRAW.liftAside));
            const cl = easeInOut(phase(t, DRAW.close));
            const open = 1 - cl;                 // 1 — крышка снята, 0 — на месте

            // откручиваем ~0.4 оборота; при закрытии крышка сначала садится
            // на горлышко, а потом плавно закручивается обратно
            const screwBack = easeInOut(phase(t, [DRAW.close[0] + 260, DRAW.close[1]]));
            const lm = lidMotion;
            lidGroup.rotation.y = -tw * lm.twist * (1 - screwBack);
            lidGroup.position.y = LID_BASE_Y + (tw * lm.pop + la * lm.ay) * open;
            lidGroup.position.x = la * lm.ax * open;
            lidGroup.position.z = la * lm.az * open;
            lidGroup.rotation.z = -la * lm.rz * open;
            lidGroup.rotation.x = la * lm.rx * open;
            if (sceneMode === 'gift') updateGiftBow(tw, open);

            // ---------- свет из горлышка ----------
            const glowIn = easeOut(phase(t, DRAW.glow));
            const glowOut = phase(t, [1700, 2150]);
            const glow = glowIn * (1 - glowOut);
            neckGlow.material.opacity = glow * (0.85 + Math.sin(t / 70) * 0.08);
            neckGlow.scale.set(3.2 + glow * 0.6, 1.8 + glow * 0.5, 1);
            innerLight.intensity = 0.6 + glow * 1.4;

            // ---------- свиток ----------
            const si = phase(t, DRAW.scrollIn);
            const sf = phase(t, DRAW.scrollFly);
            pullScroll.visible = t >= DRAW.scrollIn[0] && sf < 1;
            if (pullScroll.visible) {
                const rise = easeOut(si);
                const fly = easeInOut(sf);
                pullScroll.position.set(
                    Math.sin(si * Math.PI) * 0.12,              // лёгкое покачивание при подъёме
                    0.4 + rise * 2.35 - fly * 1.9,
                    fly * 3.4
                );
                pullScroll.rotation.set(
                    fly * 1.25,                                 // наклоняется к зрителю
                    rise * Math.PI * 1.6,                       // проворачивается, пока тянут
                    Math.sin(si * Math.PI * 2) * 0.22 * (1 - fly) - 0.12
                );
                const s = 1 + fly * 0.5;
                pullScroll.scale.set(s, s, s);
                const alpha = clamp01(si * 5) * (1 - clamp01((sf - 0.35) / 0.65));
                scrollMaterials.forEach(m => m.opacity = alpha);
            }

            // искры стартуют, когда свиток показывается над горлышком
            if (sparkles.userData.start < 0 && t >= 1180) {
                sparkles.userData.start = now;
                sparkles.visible = true;
                haptic('light');
            }

            // ---------- бумажный лист ----------
            if (!drawState.revealed && t >= DRAW.reveal) {
                drawState.revealed = true;
                drawState.onReveal && drawState.onReveal();
            }

            if (t >= DRAW.end) finishDrawSequence();
        }

        function finishDrawSequence() {
            if (lidGroup) {
                lidGroup.position.set(0, LID_BASE_Y, 0);
                lidGroup.rotation.set(0, 0, 0);
            }
            if (pullScroll) pullScroll.visible = false;
            if (neckGlow) neckGlow.material.opacity = 0;
            if (innerLight) innerLight.intensity = 0.6;
            jarGroup.position.set(0, 0, 0);
            jarGroup.rotation.z = 0;
            jarNotes.forEach(n => {
                n.position.y = n.userData.base.y;
                n.rotation.x = n.userData.base.rx;
                n.rotation.z = n.userData.base.rz;
            });
            if (drawState && !drawState.revealed && drawState.onReveal) drawState.onReveal();
            drawState = null;
            document.querySelectorAll('.randomize-btn').forEach(b => b.classList.remove('drawing'));
            if (sceneMode === 'gift') updateGiftBow(0, 0);
        }

        // Банка вздрагивает перед открытием, записки внутри шуршат,
        // а пока свиток вытягивают — верхние записки тянутся следом.
        function updateJarShake(now) {
            if (!drawState) return;
            const t = now - drawState.start;

            const sh = phase(t, DRAW.shake);
            const shakeAmp = sh < 1 ? Math.sin(sh * Math.PI) : 0;
            jarGroup.position.x = Math.sin(t / 26) * 0.06 * shakeAmp;
            jarGroup.rotation.z = Math.sin(t / 34) * 0.035 * shakeAmp;
            // после закрытия крышки — маленький «приземляющийся» прыжок
            const land = phase(t, [DRAW.close[1] - 120, DRAW.end]);
            jarGroup.position.y = land > 0 && land < 1 ? Math.sin(land * Math.PI) * -0.04 : 0;

            const rustle = shakeAmp + Math.sin(phase(t, DRAW.scrollIn) * Math.PI) * 0.7;
            jarNotes.forEach((n, i) => {
                const b = n.userData.base;
                const topness = clamp01((b.y + 0.2) / 1.6);   // верхние шевелятся сильнее
                n.position.y = b.y + Math.abs(Math.sin(t / 60 + i)) * 0.07 * rustle * topness;
                n.rotation.x = b.rx + Math.sin(t / 45 + i * 1.7) * 0.18 * rustle;
                n.rotation.z = b.rz + Math.cos(t / 52 + i * 1.3) * 0.18 * rustle;
            });
        }

        function updateSparkles(now) {
            if (!sparkles || sparkles.userData.start < 0) return;
            const t = (now - sparkles.userData.start) / 1000;
            const pos = sparkles.geometry.attributes.position.array;
            let alive = 0;
            sparkles.userData.seeds.forEach((sd, i) => {
                const lt = clamp01((t - sd.delay) / sd.life);
                const r = sd.spread * easeOut(lt);
                pos[i * 3]     = Math.cos(sd.angle) * r;
                pos[i * 3 + 1] = 2.2 + sd.speed * easeOut(lt) * 0.9 - lt * lt * 0.4;
                pos[i * 3 + 2] = Math.sin(sd.angle) * r * 0.6 + 0.4;
                if (lt < 1) alive++;
            });
            sparkles.geometry.attributes.position.needsUpdate = true;
            sparkles.material.opacity = clamp01(t * 6) * clamp01(1.4 - t);
            if (alive === 0 || t > 1.6) {
                sparkles.visible = false;
                sparkles.userData.start = -1;
            }
        }

        // Пустая банка / нет идей: банка просто вздрагивает, крышка не открывается
        function nudgeJar() {
            if (!jarGroup) return;
            const start = performance.now();
            haptic('rigid');
            (function wobble() {
                const p = (performance.now() - start) / 420;
                if (p >= 1 || drawState) { if (!drawState) { jarGroup.position.x = 0; jarGroup.rotation.z = 0; } return; }
                const a = Math.sin(p * Math.PI);
                jarGroup.position.x = Math.sin(p * 40) * 0.07 * a;
                jarGroup.rotation.z = Math.sin(p * 32) * 0.04 * a;
                requestAnimationFrame(wobble);
            })();
        }

        const prefersReducedMotion = () =>
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;


        // =====================================================================
        //  НОВОГОДНИЙ РАЗДЕЛ
        // =====================================================================

        function findIdeaById(id) {
            const base = dateIdeas.find(i => i.id === id);
            if (base) return { title: base.title, ny: false };
            if (typeof newYearIdeas !== 'undefined') {
                const ny = newYearIdeas.find(i => i.id === id);
                if (ny) return { title: ny.title, ny: true };
            }
            return null;
        }

        function resetNote() {
            const note = document.getElementById('note');
            note.classList.remove('show', 'ny-note');
            note.classList.add('hidden');
            document.getElementById('note-text').textContent = 'Нажмите кнопку ниже';
            document.getElementById('remove-btn').classList.add('hidden');
            currentIdeaId = null;
        }

        // Переключает 3D-сцену между банкой и подарком и переносит канвас
        // с запиской в контейнер активной вкладки.
        function setSceneMode(mode) {
            if (!jarGroup || mode === sceneMode) return;
            if (mode === 'gift' && !giftModel) return;

            if (drawState) {
                drawState.onReveal = null;
                finishDrawSequence();
            }

            sceneMode = mode;
            const stage = document.getElementById(mode === 'gift' ? 'ny-stage' : 'jar-stage');
            const canvas = renderer.domElement;
            const note = document.getElementById('note');
            stage.appendChild(canvas);
            stage.appendChild(note);

            jarModel.visible = mode === 'jar';
            giftModel.visible = mode === 'gift';
            lidGroup = mode === 'gift' ? giftLid : jarLid;
            jarNotes = mode === 'gift' ? giftModel.userData.notes : jarModel.userData.notes;
            lidMotion = LID_MOTION[mode];
            if (sparkles) sparkles.material.color.setHex(mode === 'gift' ? 0xffd98a : 0xffc4d4);
            if (neckGlow) neckGlow.position.y = mode === 'gift' ? 1.95 : 2.25;   // коробка ниже горлышка банки

            resetNote();
            onWindowResize();
        }

        function randomizeNewYear() {
            if (drawState) return;

            const note = document.getElementById('note');
            const noteText = document.getElementById('note-text');
            const removeBtn = document.getElementById('remove-btn');

            const showMessage = (text) => {
                note.classList.remove('ny-note');
                noteText.textContent = text;
                removeBtn.classList.add('hidden');
                showNote(note);
                nudgeJar();
            };

            if (typeof newYearIdeas === 'undefined' || !newYearIdeas.length) {
                showMessage('Новогодние идеи не загрузились. Проверьте, что файл new_year_ideas.js лежит рядом с index.html');
                return;
            }

            const pool = newYearIdeas.filter(idea => !removedIdeas.includes(idea.id));

            if (pool.length === 0) {
                showMessage('Все новогодние идеи убраны. Верните их во вкладке «Удалённые»');
                return;
            }

            const idea = pool[Math.floor(Math.random() * pool.length)];
            currentIdeaId = idea.id;

            note.classList.remove('show');
            note.classList.add('hidden');

            const reveal = () => {
                noteText.textContent = '';
                const title = document.createElement('div');
                title.className = 'ny-note-title';
                title.textContent = idea.title;
                const text = document.createElement('div');
                text.className = 'ny-note-body';
                text.textContent = idea.text;
                noteText.append(title, text);

                note.classList.remove('short-text', 'medium-text', 'long-text');
                note.classList.add('ny-note');
                removeBtn.classList.remove('hidden');
                showNote(note);
                note.scrollTop = 0;
                addToHistory(idea.title, true);
            };

            if (prefersReducedMotion() || !lidGroup) {
                setTimeout(reveal, 200);
            } else {
                startDrawSequence(reveal);
            }
        }

        // ----------------------------------------------------------- 3D: подарок
        function makeWrapTexture() {
            const size = 256;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const g = c.getContext('2d');
            const bg = g.createLinearGradient(0, 0, size, size);
            bg.addColorStop(0, '#d9566f');
            bg.addColorStop(1, '#bf3f59');
            g.fillStyle = bg;
            g.fillRect(0, 0, size, size);

            // белые снежинки и золотые точки в шахматном порядке
            const step = 64;
            for (let y = 0; y < size; y += step) {
                for (let x = 0; x < size; x += step) {
                    const cx = x + step / 2, cy = y + step / 2;
                    g.strokeStyle = 'rgba(255,255,255,0.75)';
                    g.lineWidth = 2;
                    g.lineCap = 'round';
                    for (let k = 0; k < 6; k++) {
                        const ang = k * Math.PI / 3;
                        g.beginPath();
                        g.moveTo(cx, cy);
                        g.lineTo(cx + Math.cos(ang) * 11, cy + Math.sin(ang) * 11);
                        g.stroke();
                    }
                    g.fillStyle = 'rgba(243,217,153,0.9)';
                    g.beginPath();
                    g.arc(x, y, 3, 0, Math.PI * 2);
                    g.fill();
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1.5, 1.5);
            return tex;
        }

        function makeGiftInsideTexture() {
            const size = 256;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const g = c.getContext('2d');
            const r = g.createRadialGradient(size / 2, size / 2, 10, size / 2, size / 2, size * 0.7);
            r.addColorStop(0, '#ffe8b8');
            r.addColorStop(0.35, '#e7a07a');
            r.addColorStop(1, '#5c1a2b');
            g.fillStyle = r;
            g.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(c);
        }

        function buildGiftModel() {
            giftModel = new THREE.Group();
            giftModel.visible = false;
            giftModel.userData.notes = [];
            // чуть меньше банки, чтобы снятая крышка с бантом не уходила за верх кадра
            giftModel.scale.setScalar(0.88);
            jarGroup.add(giftModel);

            const paper = new THREE.MeshPhongMaterial({
                map: makeWrapTexture(), color: 0xffffff, shininess: 22, specular: 0x442a2a
            });
            const inside = new THREE.MeshBasicMaterial({ map: makeGiftInsideTexture() });
            const gold = new THREE.MeshPhongMaterial({ color: 0xe2b457, specular: 0xfff1c9, shininess: 90 });
            const snow = new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0xdfefff, shininess: 12 });

            // коробка: верх на y = 2, как горлышко банки, — так общая анимация
            // свитка и света из горлышка подходит без изменений
            const W = 3.0, H = 3.7, TOP = 2.0, cy = TOP - H / 2;
            const box = new THREE.Mesh(new THREE.BoxGeometry(W, H, W),
                [paper, paper, inside, paper, paper, paper]);   // верхняя грань — «внутренность»
            box.position.y = cy;
            giftModel.add(box);

            const rib1 = new THREE.Mesh(new THREE.BoxGeometry(0.42, H - 0.02, W + 0.04), gold);
            rib1.position.y = cy - 0.01;
            const rib2 = new THREE.Mesh(new THREE.BoxGeometry(W + 0.04, H - 0.02, 0.42), gold);
            rib2.position.y = cy - 0.01;
            giftModel.add(rib1, rib2);

            // бумага-тишью торчит из коробки — видна, только когда крышку сняли
            const tissueShape = new THREE.Shape();
            tissueShape.moveTo(-0.34, 0);
            tissueShape.lineTo(0.34, 0);
            tissueShape.lineTo(0.05, 0.3);
            tissueShape.lineTo(0, 0.24);
            tissueShape.lineTo(-0.12, 0.32);
            tissueShape.closePath();
            const tissueMat = new THREE.MeshBasicMaterial({ color: 0xfff1f4, side: THREE.DoubleSide });
            [[-1.1, -0.9, 0.5], [1.05, -1.0, -0.6], [-1.15, 1.0, 2.4], [0.95, 1.1, -2.2], [0.1, -1.25, 0.1]]
                .forEach(([x, z, ry]) => {
                    const t = new THREE.Mesh(new THREE.ShapeGeometry(tissueShape), tissueMat);
                    t.position.set(x, TOP - 0.01, z);
                    t.rotation.y = ry;
                    t.rotation.x = -0.25;
                    giftModel.add(t);
                });

            // тень под коробкой
            const shadow = new THREE.Mesh(
                new THREE.PlaneGeometry(4.6, 2.0),
                new THREE.MeshBasicMaterial({
                    map: makeGlowTexture('rgba(110,60,70,0.45)', 'rgba(110,60,70,0.12)'),
                    transparent: true, depthWrite: false
                })
            );
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = cy - H / 2 - 0.01;
            giftModel.add(shadow);

            // крышка
            giftLid = new THREE.Group();
            giftLid.position.y = LID_BASE_Y;
            giftLid.rotation.order = 'ZXY';
            giftModel.add(giftLid);

            giftLid.add(new THREE.Mesh(new THREE.BoxGeometry(3.16, 0.5, 3.16), paper));
            giftLid.add(new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.52, 3.2), gold));
            giftLid.add(new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.52, 0.44), gold));

            // бант: две петли, узелок и хвостики
            giftBowParts = [];
            [-1, 1].forEach(dir => {
                const loop = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.11, 12, 32), gold);
                loop.position.set(dir * 0.4, 0.6, 0);
                loop.scale.set(1, 0.72, 1);
                loop.rotation.set(0, dir * 0.35, -dir * 0.55);
                giftLid.add(loop);
                giftBowParts.push({ mesh: loop, dir, rz: loop.rotation.z, x: loop.position.x });

                const tail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.95), gold);
                tail.position.set(dir * 0.28, 0.27, 0.5);
                tail.rotation.y = dir * 0.5;
                giftLid.add(tail);
            });
            const knot = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), gold);
            knot.scale.set(1, 0.85, 0.8);
            knot.position.y = 0.42;
            giftLid.add(knot);

            // немного снега на крышке
            [[-1.1, -0.95, 0.38], [1.05, 1.05, 0.32], [-0.95, 1.1, 0.26]].forEach(([x, z, r]) => {
                const lump = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 10), snow);
                lump.scale.set(1, 0.3, 0.85);
                lump.position.set(x, 0.26, z);
                giftLid.add(lump);
            });
        }

        // Бант «распускается», пока снимают крышку, и собирается обратно.
        function updateGiftBow(tw, open) {
            const k = tw * open;
            giftBowParts.forEach(p => {
                p.mesh.rotation.z = p.rz - p.dir * 0.45 * k;
                p.mesh.position.x = p.x + p.dir * 0.12 * k;
                const sc = 1 + 0.15 * k;
                p.mesh.scale.set(sc, 0.72 * sc, sc);
            });
        }

        // ----------------------------------------------------------- 3D: иней на банке
        function makeFrostTexture() {
            const w = 512, h = 256;
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const g = c.getContext('2d');

            const bottom = g.createLinearGradient(0, h, 0, h * 0.62);
            bottom.addColorStop(0, 'rgba(255,255,255,0.55)');
            bottom.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = bottom;
            g.fillRect(0, h * 0.62, w, h * 0.38);

            const top = g.createLinearGradient(0, 0, 0, h * 0.16);
            top.addColorStop(0, 'rgba(255,255,255,0.4)');
            top.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = top;
            g.fillRect(0, 0, w, h * 0.16);

            // морозные «папоротники»
            g.lineCap = 'round';
            function branch(x, y, len, ang, depth) {
                if (depth === 0 || len < 2) return;
                const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
                g.strokeStyle = `rgba(255,255,255,${0.25 + depth * 0.1})`;
                g.lineWidth = depth * 0.55;
                g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
                for (let i = 1; i <= 3; i++) {
                    const f = i / 4;
                    const bx = x + (x2 - x) * f, by = y + (y2 - y) * f;
                    branch(bx, by, len * 0.42, ang - 0.7, depth - 1);
                    branch(bx, by, len * 0.42, ang + 0.7, depth - 1);
                }
                branch(x2, y2, len * 0.6, ang + (Math.random() - 0.5) * 0.4, depth - 1);
            }
            for (let i = 0; i < 22; i++) {
                branch(Math.random() * w, h, 18 + Math.random() * 26,
                       -Math.PI / 2 + (Math.random() - 0.5) * 1.1, 3);
            }
            for (let i = 0; i < 10; i++) {
                branch(Math.random() * w, 0, 10 + Math.random() * 14,
                       Math.PI / 2 + (Math.random() - 0.5) * 1.0, 3);
            }
            for (let i = 0; i < 260; i++) {
                g.fillStyle = `rgba(255,255,255,${Math.random() * 0.5})`;
                g.fillRect(Math.random() * w, h * (0.55 + Math.random() * 0.45), 1.5, 1.5);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.repeat.set(2, 1);
            return tex;
        }

        function addWinterToJar() {
            const frost = new THREE.Mesh(
                new THREE.CylinderGeometry(1.512, 1.512, 4, 48, 1, true),
                new THREE.MeshBasicMaterial({
                    map: makeFrostTexture(),
                    transparent: true,
                    opacity: 0.9,
                    depthWrite: false
                })
            );
            jarModel.add(frost);

            // снежная шапка на крышке банки
            const snow = new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0xdfefff, shininess: 12 });
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.27, 0.07, 48), snow);
            cap.position.y = 0.19;
            jarLid.add(cap);
            [[-0.7, -0.5, 0.36], [0.6, 0.65, 0.3], [0.75, -0.55, 0.24]].forEach(([x, z, r]) => {
                const lump = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 10), snow);
                lump.scale.set(1, 0.32, 0.85);
                lump.position.set(x, 0.22, z);
                jarLid.add(lump);
            });
        }

        // ----------------------------------------------------------- снег, гирлянда, счётчик
        function startSnow() {
            if (prefersReducedMotion()) return;
            const canvas = document.createElement('canvas');
            canvas.className = 'snow-layer';
            canvas.setAttribute('aria-hidden', 'true');
            document.body.prepend(canvas);
            const ctx = canvas.getContext('2d');
            let w = 0, h = 0, flakes = [];
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            function makeFlake(randomY) {
                const r = 0.8 + Math.random() * 2.6;
                return {
                    x: Math.random() * w,
                    y: randomY ? Math.random() * h : -5,
                    r,
                    vy: 18 + r * 14 + Math.random() * 10,          // px/с: крупные падают быстрее
                    sway: 10 + Math.random() * 20,
                    freq: 0.4 + Math.random() * 0.8,
                    ph: Math.random() * Math.PI * 2,
                    a: 0.45 + Math.random() * 0.45
                };
            }
            function resize() {
                w = window.innerWidth; h = window.innerHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const count = Math.round(Math.min(90, Math.max(40, w * h / 9000)));
                while (flakes.length < count) flakes.push(makeFlake(true));
                flakes.length = count;
            }
            resize();
            window.addEventListener('resize', resize);

            let last = performance.now();
            (function frame(now) {
                requestAnimationFrame(frame);
                const dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                if (document.hidden) return;
                ctx.clearRect(0, 0, w, h);
                const t = now / 1000;
                for (const f of flakes) {
                    f.y += f.vy * dt;
                    if (f.y > h + 5) Object.assign(f, makeFlake(false));
                    const x = f.x + Math.sin(t * f.freq + f.ph) * f.sway;
                    ctx.globalAlpha = f.a;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(x, f.y, f.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            })(last);
        }

        function buildGarland() {
            const el = document.getElementById('garland');
            if (!el) return;
            const w = el.clientWidth;
            if (!w) return;
            const top = 4, sag = 12;
            const spans = Math.max(3, Math.round(w / 90));
            const seg = w / spans;
            const colors = ['#ff8fb1', '#ffd36e', '#dff1ff', '#e8476a'];
            let d = `M0 ${top}`;
            let html = '';
            let n = 0;
            for (let k = 0; k < spans; k++) {
                const x0 = k * seg, x1 = x0 + seg, cx = x0 + seg / 2, cyc = top + sag * 2;
                d += ` Q ${cx.toFixed(1)} ${cyc} ${x1.toFixed(1)} ${top}`;
                [0.22, 0.5, 0.78].forEach(t => {
                    const u = 1 - t;
                    const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
                    const y = u * u * top + 2 * u * t * cyc + t * t * top;
                    html += `<span class="bulb" style="left:${x.toFixed(1)}px;top:${(y + 2).toFixed(1)}px;` +
                            `--bulb:${colors[n % 4]};animation-delay:${(n % 4) * -0.6}s"></span>`;
                    n++;
                });
            }
            el.innerHTML = `<svg width="${w}" height="36" viewBox="0 0 ${w} 36" aria-hidden="true">` +
                `<path d="${d}" fill="none" stroke="#7d8a72" stroke-width="1.4"/></svg>` + html;
        }

        function ruPlural(n, one, few, many) {
            const m10 = n % 10, m100 = n % 100;
            if (m10 === 1 && m100 !== 11) return one;
            if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
            return many;
        }

        function updateCountdown() {
            const el = document.getElementById('ny-countdown');
            if (!el) return;
            const flake = '<svg class="icon" aria-hidden="true"><use href="#icon-snowflake"/></svg>';
            const now = new Date();
            if (now.getMonth() === 0 && now.getDate() <= 14) {
                el.innerHTML = `${flake}<span>С Новым годом! Пусть он будет полон свиданий</span>${flake}`;
                return;
            }
            const target = new Date(now.getFullYear() + 1, 0, 1);
            const diff = target - now;
            const days = Math.floor(diff / 86400000);
            let text;
            if (days >= 1) {
                text = `До Нового года <b>${days}</b> ${ruPlural(days, 'день', 'дня', 'дней')}`;
            } else {
                const hours = Math.floor(diff / 3600000);
                text = hours >= 1
                    ? `До Нового года <b>${hours}</b> ${ruPlural(hours, 'час', 'часа', 'часов')}`
                    : 'До Нового года меньше часа!';
            }
            el.innerHTML = `${flake}<span>${text}</span>${flake}`;
        }

        function initNewYearTheme() {
            startSnow();
            buildGarland();
            updateCountdown();
            setInterval(updateCountdown, 60000);
            let garlandTimer = null;
            window.addEventListener('resize', () => {
                clearTimeout(garlandTimer);
                garlandTimer = setTimeout(buildGarland, 150);
            });
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const filterType = e.target.dataset.filter;
                    const value = e.target.dataset.value;
                    
                    document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(b => {
                        b.classList.remove('selected');
                    });
                    
                    e.target.classList.add('selected');
                    filters[filterType] = value;
                });
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            if (tabName === 'newyear') setSceneMode('gift');
            else if (tabName === 'main') setSceneMode('jar');
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('preset-filters').style.display = mode === 'preset' ? 'block' : 'none';
        }

        function showNote(note) {
            // перезапуск CSS-анимации листа, даже если класс уже стоит
            note.classList.remove('show');
            note.classList.remove('hidden');
            void note.offsetWidth;
            note.classList.add('show');
        }

        function randomize() {
            // пока банка открыта и записку тянут — повторные нажатия игнорируем
            if (drawState) return;

            const note = document.getElementById('note');
            const noteText = document.getElementById('note-text');
            const removeBtn = document.getElementById('remove-btn');
            let selectedDate, selectedId;

            if (currentMode === 'preset') {
                let filteredIdeas = dateIdeas.filter(idea => {
                    if (removedIdeas.includes(idea.id)) return false;

                    return (filters.budget === 'all' || idea.budget === filters.budget) &&
                           (filters.location === 'all' || idea.location === filters.location) &&
                           (filters.mood === 'all' || idea.mood === filters.mood) &&
                           (filters.season === 'all' || idea.season === 'any' || idea.season === filters.season);
                });

                if (filteredIdeas.length === 0) {
                    noteText.textContent = 'Нет идей с такими фильтрами';
                    removeBtn.classList.add('hidden');
                    showNote(note);
                    nudgeJar();
                    return;
                }

                const selected = filteredIdeas[Math.floor(Math.random() * filteredIdeas.length)];
                selectedDate = selected.title;
                selectedId = selected.id;
            } else {
                if (customIdeas.length === 0) {
                    noteText.textContent = 'Добавьте свои идеи на вкладке "Свои идеи"';
                    removeBtn.classList.add('hidden');
                    showNote(note);
                    nudgeJar();
                    return;
                }
                selectedDate = customIdeas[Math.floor(Math.random() * customIdeas.length)];
                selectedId = null;
            }

            currentIdeaId = selectedId;

            // предыдущая записка «ныряет» обратно в банку
            note.classList.remove('show');
            note.classList.add('hidden');

            const reveal = () => {
                noteText.textContent = selectedDate;
                // Подбираем кегль под длину идеи, чтобы текст поместился в банку
                note.classList.remove('short-text', 'medium-text', 'long-text', 'ny-note');
                if (selectedDate.length > 190) {
                    note.classList.add('long-text');
                } else if (selectedDate.length > 120) {
                    note.classList.add('medium-text');
                } else {
                    note.classList.add('short-text');
                }
                if (selectedId !== null) {
                    removeBtn.classList.remove('hidden');
                } else {
                    removeBtn.classList.add('hidden');
                }
                showNote(note);
                addToHistory(selectedDate);
            };

            if (prefersReducedMotion() || !lidGroup) {
                // без анимаций — как раньше, просто показываем записку
                setTimeout(reveal, 200);
            } else {
                startDrawSequence(reveal);
            }
        }

        function removeCurrentIdea() {
            if (currentIdeaId !== null && !removedIdeas.includes(currentIdeaId)) {
                removedIdeas.push(currentIdeaId);
                localStorage.setItem('removedIdeas', JSON.stringify(removedIdeas));
                
                const note = document.getElementById('note');
                const noteText = document.getElementById('note-text');
                const removeBtn = document.getElementById('remove-btn');
                
                noteText.textContent = 'Идея удалена. Найдите её во вкладке "Удалённые"';
                removeBtn.classList.add('hidden');
                
                currentIdeaId = null;
                renderRemovedList();
            }
        }

        function addCustomIdea() {
            const input = document.getElementById('custom-idea-input');
            const idea = input.value.trim();
            
            if (idea) {
                customIdeas.push(idea);
                localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
                input.value = '';
                renderCustomList();
            }
        }

        function renderCustomList() {
            const list = document.getElementById('custom-list');
            const empty = document.getElementById('custom-empty');
            
            if (customIdeas.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = customIdeas.map((idea, index) => `
                    <li class="custom-item">
                        <span>${idea}</span>
                        <button class="delete-btn" onclick="deleteCustomIdea(${index})">
                            <svg class="icon"><use href="#icon-trash"/></svg>
                        </button>
                    </li>
                `).join('');
            }
        }

        function deleteCustomIdea(index) {
            customIdeas.splice(index, 1);
            localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
            renderCustomList();
        }

        function addToHistory(dateTitle, isNewYear) {
            const historyItem = {
                id: Date.now(),
                title: dateTitle,
                ny: !!isNewYear,
                date: new Date().toLocaleDateString('ru-RU'),
                completed: false
            };
            
            history.unshift(historyItem);
            if (history.length > 50) history = history.slice(0, 50);
            localStorage.setItem('dateHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const empty = document.getElementById('history-empty');
            
            if (history.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = history.map(item => `
                    <li class="history-item ${item.completed ? 'completed' : ''}">
                        <div class="history-item-header">
                            <div>
                                <div class="history-item-title">${item.ny ? '<span class="ny-badge" title="Новогодняя идея">🎄</span>' : ''}${item.title}</div>
                                <div class="history-item-date">${item.date}</div>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} 
                                       onchange="toggleCompleted(${item.id})">
                                <span>✓</span>
                            </label>
                        </div>
                    </li>
                `).join('');
            }
        }

        function toggleCompleted(id) {
            const item = history.find(h => h.id === id);
            if (item) {
                item.completed = !item.completed;
                localStorage.setItem('dateHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderRemovedList() {
            const list = document.getElementById('removed-list');
            const empty = document.getElementById('removed-empty');
            
            if (removedIdeas.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                
                const removedWithTitles = removedIdeas.map(id => {
                    const idea = findIdeaById(id);
                    return idea ? { id, title: idea.ny ? '🎄 ' + idea.title : idea.title } : null;
                }).filter(Boolean);
                
                list.innerHTML = removedWithTitles.map(item => `
                    <li class="custom-item">
                        <span>${item.title}</span>
                        <button class="restore-btn" onclick="restoreIdea(${item.id})">
                            <svg class="icon"><use href="#icon-sparkles"/></svg>
                        </button>
                    </li>
                `).join('');
            }
        }

        function restoreIdea(ideaId) {
            removedIdeas = removedIdeas.filter(id => id !== ideaId);
            localStorage.setItem('removedIdeas', JSON.stringify(removedIdeas));
            renderRemovedList();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            setupFilters();
            if (window.NY_THEME) initNewYearTheme();
            renderCustomList();
            renderHistory();
            renderRemovedList();
            
            document.getElementById('custom-idea-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addCustomIdea();
                }
            });
        });
    </script>
</body>
