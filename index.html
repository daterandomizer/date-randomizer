<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Рандомайзер Свиданий</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            background: linear-gradient(135deg, #ffe0e5 0%, #ffd4d8 25%, #f5d5d0 50%, #ead5d5 75%, #e0d0d0 100%);
            min-height: 100vh;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,182,193,0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(216,191,216,0.1) 0%, transparent 70%);
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        /* Анимированные сердечки на фоне */
        .heart-decoration {
            position: fixed;
            color: rgba(212, 165, 165, 0.15);
            font-size: 40px;
            animation: floatHeart 15s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
            user-select: none;
        }

        .heart-decoration:nth-child(1) { 
            top: 10%; 
            left: 5%; 
            animation-delay: 0s; 
            font-size: 35px;
        }
        .heart-decoration:nth-child(2) { 
            top: 20%; 
            right: 8%; 
            animation-delay: 3s; 
            font-size: 45px;
        }
        .heart-decoration:nth-child(3) { 
            bottom: 25%; 
            left: 10%; 
            animation-delay: 6s; 
            font-size: 30px;
        }
        .heart-decoration:nth-child(4) { 
            bottom: 15%; 
            right: 12%; 
            animation-delay: 9s; 
            font-size: 50px;
        }
        .heart-decoration:nth-child(5) { 
            top: 50%; 
            left: 15%; 
            animation-delay: 4s; 
            font-size: 38px;
        }
        .heart-decoration:nth-child(6) { 
            top: 60%; 
            right: 15%; 
            animation-delay: 7s; 
            font-size: 42px;
        }
        .heart-decoration:nth-child(7) { 
            top: 35%; 
            right: 5%; 
            animation-delay: 2s; 
            font-size: 33px;
        }
        .heart-decoration:nth-child(8) { 
            bottom: 40%; 
            left: 3%; 
            animation-delay: 5s; 
            font-size: 36px;
        }

        @keyframes floatHeart {
            0%, 100% { 
                transform: translateY(0) scale(1) rotate(0deg); 
                opacity: 0.1; 
            }
            25% { 
                transform: translateY(-20px) scale(1.1) rotate(5deg); 
                opacity: 0.15; 
            }
            50% { 
                transform: translateY(-10px) scale(0.95) rotate(-3deg); 
                opacity: 0.12; 
            }
            75% { 
                transform: translateY(-30px) scale(1.05) rotate(7deg); 
                opacity: 0.18; 
            }
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Заголовок без сердец - просто текст по центру */
        .header h1 {
            background: linear-gradient(135deg, #c47d8a 0%, #a06570 50%, #8b5e5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #a07878;
            font-size: 0.95em;
            font-weight: 400;
            opacity: 0.9;
            padding: 0 10px;
        }

        .icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .icon-lg {
            width: 22px;
            height: 22px;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 
                0 10px 40px rgba(139, 94, 94, 0.15),
                0 2px 10px rgba(139, 94, 94, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeInUp 0.8s ease-out;
        }

        /* ===== Сердечки внутри основной плашки ===== */
        .card-hearts {
            position: absolute;
            inset: 0;
            border-radius: 25px;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .card-hearts span {
            position: absolute;
            color: rgba(201, 141, 141, 0.10);
            animation: floatHeartCard 14s infinite ease-in-out;
            user-select: none;
            line-height: 1;
        }

        .card-hearts span:nth-child(1) { top: 6%;  left: 6%;  font-size: 34px; animation-delay: 0s; }
        .card-hearts span:nth-child(2) { top: 13%; right: 9%; font-size: 26px; animation-delay: 2.5s; }
        .card-hearts span:nth-child(3) { top: 42%; left: 3%;  font-size: 30px; animation-delay: 5s; }
        .card-hearts span:nth-child(4) { bottom: 18%; right: 5%; font-size: 38px; animation-delay: 1.5s; }
        .card-hearts span:nth-child(5) { bottom: 7%;  left: 12%; font-size: 22px; animation-delay: 7s; }
        .card-hearts span:nth-child(6) { top: 68%; right: 14%; font-size: 28px; animation-delay: 3.5s; }

        @keyframes floatHeartCard {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg);      opacity: 0.10; }
            30%      { transform: translateY(-14px) scale(1.12) rotate(6deg); opacity: 0.17; }
            60%      { transform: translateY(-6px) scale(0.94) rotate(-4deg); opacity: 0.12; }
            85%      { transform: translateY(-20px) scale(1.06) rotate(8deg); opacity: 0.20; }
        }

        /* Контент всегда поверх сердечек внутри плашки */
        .card > *:not(.card-hearts) {
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex: 1;
            min-width: 80px;
            padding: 12px 8px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 14px;
            color: #8b5e5e;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            font-family: 'Comfortaa', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab-text {
            font-size: 0.8em;
        }

        .tab.active {
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 100%);
            color: white;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 6px 20px rgba(139, 94, 94, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-content.active {
            display: block;
        }

        .filters {
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b5e5e;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 20px;
            color: #8b5e5e;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85em;
            font-weight: 500;
            font-family: 'Comfortaa', cursive;
            white-space: nowrap;
        }

        .filter-btn.selected {
            background: linear-gradient(135deg, #ffc4d0 0%, #ffb3c6 100%);
            border-color: #d4a5a5;
            color: #6b4545;
            box-shadow: 
                0 4px 15px rgba(212, 165, 165, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .jar-container {
            position: relative;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0 20px 0;
        }

        #jar-canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .note-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 94%;
            max-width: 310px;
            min-height: 160px;
            background: linear-gradient(135deg, #fff9f0 0%, #fff5e6 100%);
            border: 2px solid #d4a5a5;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            text-align: center;
            color: #8b5e5e;
            font-size: 1.1em;
            line-height: 1.5;
            font-weight: 500;
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.8);
            font-family: 'Caveat', cursive;
            z-index: 5;
            pointer-events: none;
            max-height: 100%;
            overflow-y: auto;
        }

        /* Длинные идеи — чуть мельче, чтобы целиком помещались в банку */
        .note-overlay.medium-text { font-size: 1em; }
        .note-overlay.long-text   { font-size: 0.9em; line-height: 1.42; }
        .note-overlay.short-text  { font-size: 1.25em; }

        .note-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 1px,
                    rgba(212, 165, 165, 0.03) 2px,
                    rgba(212, 165, 165, 0.03) 3px
                );
            border-radius: 12px;
            pointer-events: none;
        }

        .note-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 20px 20px 0;
            border-color: transparent #f0d5d0 transparent transparent;
            border-radius: 0 0 0 3px;
        }

        .note-overlay.hidden {
            opacity: 0;
            transform: translate(-50%, 150%) scale(0.3);
            pointer-events: none;
        }

        .note-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: popOut 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
        }

        @keyframes popOut {
            0% {
                transform: translate(-50%, 150%) scale(0.3);
                opacity: 0;
            }
            60% {
                transform: translate(-50%, -55%) scale(1.08);
            }
            80% {
                transform: translate(-50%, -48%) scale(0.98);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .note-text {
            margin-bottom: 8px;
        }

        .remove-idea-btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, #cc9999 0%, #b88989 100%);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 0.75em;
            font-family: 'Comfortaa', cursive;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 6px;
            pointer-events: auto;
            box-shadow: 0 3px 10px rgba(139, 94, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .remove-idea-btn.hidden {
            display: none;
        }

        .randomize-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 50%, #b88989 100%);
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 6px 25px rgba(139, 94, 94, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            font-family: 'Comfortaa', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .randomize-btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.3);
        }

        .custom-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .custom-input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #f0e0e0;
            border-radius: 14px;
            font-size: 0.95em;
            color: #8b5e5e;
            font-family: 'Comfortaa', cursive;
            transition: all 0.3s;
            background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        }

        .custom-input:focus {
            outline: none;
            border-color: #d4a5a5;
            box-shadow: 0 0 0 3px rgba(212, 165, 165, 0.1);
        }

        .add-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #d4a5a5 0%, #b88989 100%);
            border: none;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1em;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.25);
        }

        .delete-btn {
            background: linear-gradient(135deg, #cc9999 0%, #b88989 100%);
            padding: 8px 12px;
            font-size: 0.85em;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 3px 10px rgba(139, 94, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restore-btn {
            background: linear-gradient(135deg, #90d490 0%, #70b070 100%);
            padding: 8px 12px;
            font-size: 0.85em;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 3px 10px rgba(70, 140, 70, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .custom-list, .history-list {
            list-style: none;
        }

        .custom-item, .history-item {
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8b5e5e;
            border: 1px solid rgba(212, 165, 165, 0.2);
            font-size: 0.9em;
        }

        .history-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            gap: 10px;
        }

        .history-item-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9em;
        }

        .history-item-date {
            font-size: 0.8em;
            color: #a07878;
            opacity: 0.8;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 0.8em;
            white-space: nowrap;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #d4a5a5;
        }

        .history-item.completed {
            opacity: 0.5;
            filter: grayscale(0.3);
        }

        .history-item.completed .history-item-title {
            text-decoration: line-through;
        }

        .empty-message {
            text-align: center;
            color: #a07878;
            padding: 30px 15px;
            font-style: italic;
            opacity: 0.7;
            font-size: 0.9em;
        }

        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 14px;
            color: #8b5e5e;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-family: 'Comfortaa', cursive;
            font-size: 0.9em;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ffc4d0 0%, #ffb3c6 100%);
            border-color: #d4a5a5;
            box-shadow: 0 4px 15px rgba(212, 165, 165, 0.3);
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 0.85em;
            }

            .card {
                padding: 15px;
                border-radius: 20px;
            }

            .jar-container {
                height: 360px;
                margin: 20px 0 15px 0;
            }

            .note-overlay {
                font-size: 1em;
                padding: 16px;
                min-height: 140px;
            }

            .filter-btn {
                padding: 8px 14px;
                font-size: 0.8em;
            }

            .tab {
                min-width: 70px;
                padding: 10px 6px;
                font-size: 0.8em;
            }

            .randomize-btn {
                font-size: 1em;
                padding: 14px;
            }
        }

        /* Уважаем системную настройку «уменьшить движение» */
        @media (prefers-reduced-motion: reduce) {
            .heart-decoration,
            .card-hearts span {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <div class="heart-decoration">♥</div>
    <div class="heart-decoration">♥</div>
    <div class="heart-decoration">♥</div>
    <div class="heart-decoration">♥</div>
    <div class="heart-decoration">♥</div>
    <div class="heart-decoration">♥</div>
    <div class="heart-decoration">♥</div>
    <div class="heart-decoration">♥</div>

            </symbol>
            <symbol id="icon-pencil" viewBox="0 0 24 24">
                <path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="date_ideas.js"></script>
    <script>
        let filters = {
            budget: 'all',
            location: 'all',
            mood: 'all',
            season: 'all'
        };
        let currentMode = 'preset';
        let currentIdeaId = null;
        let customIdeas = JSON.parse(localStorage.getItem('customIdeas')) || [];
        let history = JSON.parse(localStorage.getItem('dateHistory')) || [];
        let removedIdeas = JSON.parse(localStorage.getItem('removedIdeas')) || [];

        let scene, camera, renderer, jar, lid;
        let mouseX = 0, mouseY = 0, touchX = 0, touchY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        function initThreeJS() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ 
                canvas: container, 
                alpha: true, 
                antialias: true 
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 10, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffd4d8, 0.4);
            directionalLight2.position.set(-5, -5, 5);
            scene.add(directionalLight2);

            const lidGeometry = new THREE.CylinderGeometry(1.2, 1.3, 0.3, 32);
            const lidMaterial = new THREE.MeshPhongMaterial({
                color: 0xc98d8d,
                shininess: 40,
                specular: 0x666666
            });
            lid = new THREE.Mesh(lidGeometry, lidMaterial);
            lid.position.y = 2.2;
            scene.add(lid);

            const knobGeometry = new THREE.CylinderGeometry(0.2, 0.25, 0.3, 16);
            const knob = new THREE.Mesh(knobGeometry, lidMaterial);
            knob.position.y = 2.5;
            scene.add(knob);

            const jarGeometry = new THREE.CylinderGeometry(1.5, 1.5, 4, 32, 1, true);
            const jarMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xfff5f0,
                metalness: 0.1,
                roughness: 0.05,
                transparent: true,
                opacity: 0.4,
                transmission: 0.85,
                thickness: 0.8,
                envMapIntensity: 1,
                clearcoat: 1,
                clearcoatRoughness: 0.05
            });
            jar = new THREE.Mesh(jarGeometry, jarMaterial);
            jar.position.y = 0;
            scene.add(jar);

            const edgeGeometry = new THREE.EdgesGeometry(jarGeometry);
            const edgeMaterial = new THREE.LineBasicMaterial({ 
                color: 0xd4a5a5, 
                linewidth: 2,
                transparent: true,
                opacity: 0.3
            });
            const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
            jar.add(edges);

            const bottomGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.15, 32);
            const bottomMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xf5e8e8,
                transparent: true,
                opacity: 0.5,
                metalness: 0.1,
                roughness: 0.2
            });
            const bottom = new THREE.Mesh(bottomGeometry, bottomMaterial);
            bottom.position.y = -2;
            scene.add(bottom);

            container.addEventListener('touchstart', onTouchStart, { passive: true });
            container.addEventListener('touchmove', onTouchMove, { passive: true });
            container.addEventListener('touchend', onTouchEnd, { passive: true });
            container.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onTouchStart(event) {
            if (event.touches.length > 0) {
                const rect = event.target.getBoundingClientRect();
                touchX = event.touches[0].clientX;
                touchY = event.touches[0].clientY;
            }
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                const rect = event.target.getBoundingClientRect();
                const newTouchX = event.touches[0].clientX;
                const newTouchY = event.touches[0].clientY;
                
                const deltaX = (newTouchX - touchX) / rect.width;
                const deltaY = (newTouchY - touchY) / rect.height;
                
                targetRotationY += deltaX * 2;
                targetRotationX += deltaY * 1;
                
                touchX = newTouchX;
                touchY = newTouchY;
            }
        }

        function onTouchEnd(event) {
            // Keep current rotation
        }

        function onMouseMove(event) {
            const rect = event.target.getBoundingClientRect();
            mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            targetRotationY = mouseX * 0.3;
            targetRotationX = mouseY * 0.2;
        }

        function onWindowResize() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            jar.rotation.y += (targetRotationY - jar.rotation.y) * 0.05;
            jar.rotation.x += (targetRotationX - jar.rotation.x) * 0.05;
            lid.rotation.y = jar.rotation.y;
            lid.rotation.x = jar.rotation.x;

            jar.rotation.y += 0.001;
            lid.rotation.y += 0.001;

            renderer.render(scene, camera);
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const filterType = e.target.dataset.filter;
                    const value = e.target.dataset.value;
                    
                    document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(b => {
                        b.classList.remove('selected');
                    });
                    
                    e.target.classList.add('selected');
                    filters[filterType] = value;
                });
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('preset-filters').style.display = mode === 'preset' ? 'block' : 'none';
        }

        function randomize() {
            const note = document.getElementById('note');
            const noteText = document.getElementById('note-text');
            const removeBtn = document.getElementById('remove-btn');
            let selectedDate, selectedId;

            if (currentMode === 'preset') {
                let filteredIdeas = dateIdeas.filter(idea => {
                    if (removedIdeas.includes(idea.id)) return false;
                    
                    return (filters.budget === 'all' || idea.budget === filters.budget) &&
                           (filters.location === 'all' || idea.location === filters.location) &&
                           (filters.mood === 'all' || idea.mood === filters.mood) &&
                           (filters.season === 'all' || idea.season === 'any' || idea.season === filters.season);
                });

                if (filteredIdeas.length === 0) {
                    noteText.textContent = 'Нет идей с такими фильтрами';
                    removeBtn.classList.add('hidden');
                    note.classList.remove('hidden');
                    note.classList.add('show');
                    return;
                }

                const selected = filteredIdeas[Math.floor(Math.random() * filteredIdeas.length)];
                selectedDate = selected.title;
                selectedId = selected.id;
            } else {
                if (customIdeas.length === 0) {
                    noteText.textContent = 'Добавьте свои идеи на вкладке "Свои идеи"';
                    removeBtn.classList.add('hidden');
                    note.classList.remove('hidden');
                    note.classList.add('show');
                    return;
                }
                selectedDate = customIdeas[Math.floor(Math.random() * customIdeas.length)];
                selectedId = null;
            }

            currentIdeaId = selectedId;

            note.classList.remove('show');
            note.classList.add('hidden');
            
            setTimeout(() => {
                noteText.textContent = selectedDate;
                // Подбираем кегль под длину идеи, чтобы текст поместился в банку
                note.classList.remove('short-text', 'medium-text', 'long-text');
                if (selectedDate.length > 190) {
                    note.classList.add('long-text');
                } else if (selectedDate.length > 120) {
                    note.classList.add('medium-text');
                } else {
                    note.classList.add('short-text');
                }
                if (selectedId !== null) {
                    removeBtn.classList.remove('hidden');
                } else {
                    removeBtn.classList.add('hidden');
                }
                note.classList.remove('hidden');
                void note.offsetWidth;
                note.classList.add('show');
                addToHistory(selectedDate);
            }, 200);
        }

        function removeCurrentIdea() {
            if (currentIdeaId !== null && !removedIdeas.includes(currentIdeaId)) {
                removedIdeas.push(currentIdeaId);
                localStorage.setItem('removedIdeas', JSON.stringify(removedIdeas));
                
                const note = document.getElementById('note');
                const noteText = document.getElementById('note-text');
                const removeBtn = document.getElementById('remove-btn');
                
                noteText.textContent = 'Идея удалена. Найдите её во вкладке "Удалённые"';
                removeBtn.classList.add('hidden');
                
                currentIdeaId = null;
                renderRemovedList();
            }
        }

        function addCustomIdea() {
            const input = document.getElementById('custom-idea-input');
            const idea = input.value.trim();
            
            if (idea) {
                customIdeas.push(idea);
                localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
                input.value = '';
                renderCustomList();
            }
        }

        function renderCustomList() {
            const list = document.getElementById('custom-list');
            const empty = document.getElementById('custom-empty');
            
            if (customIdeas.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = customIdeas.map((idea, index) => `
                    <li class="custom-item">
                        <span>${idea}</span>
                        <button class="delete-btn" onclick="deleteCustomIdea(${index})">
                            <svg class="icon"><use href="#icon-trash"/></svg>
                        </button>
                    </li>
                `).join('');
            }
        }

        function deleteCustomIdea(index) {
            customIdeas.splice(index, 1);
            localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
            renderCustomList();
        }

        function addToHistory(dateTitle) {
            const historyItem = {
                id: Date.now(),
                title: dateTitle,
                date: new Date().toLocaleDateString('ru-RU'),
                completed: false
            };
            
            history.unshift(historyItem);
            if (history.length > 50) history = history.slice(0, 50);
            localStorage.setItem('dateHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const empty = document.getElementById('history-empty');
            
            if (history.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = history.map(item => `
                    <li class="history-item ${item.completed ? 'completed' : ''}">
                        <div class="history-item-header">
                            <div>
                                <div class="history-item-title">${item.title}</div>
                                <div class="history-item-date">${item.date}</div>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} 
                                       onchange="toggleCompleted(${item.id})">
                                <span>✓</span>
                            </label>
                        </div>
                    </li>
                `).join('');
            }
        }

        function toggleCompleted(id) {
            const item = history.find(h => h.id === id);
            if (item) {
                item.completed = !item.completed;
                localStorage.setItem('dateHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderRemovedList() {
            const list = document.getElementById('removed-list');
            const empty = document.getElementById('removed-empty');
            
            if (removedIdeas.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                
                const removedWithTitles = removedIdeas.map(id => {
                    const idea = dateIdeas.find(i => i.id === id);
                    return idea ? { id, title: idea.title } : null;
                }).filter(Boolean);
                
                list.innerHTML = removedWithTitles.map(item => `
                    <li class="custom-item">
                        <span>${item.title}</span>
                        <button class="restore-btn" onclick="restoreIdea(${item.id})">
                            <svg class="icon"><use href="#icon-sparkles"/></svg>
                        </button>
                    </li>
                `).join('');
            }
        }

        function restoreIdea(ideaId) {
            removedIdeas = removedIdeas.filter(id => id !== ideaId);
            localStorage.setItem('removedIdeas', JSON.stringify(removedIdeas));
            renderRemovedList();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            setupFilters();
            renderCustomList();
            renderHistory();
            renderRemovedList();
            
            document.getElementById('custom-idea-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addCustomIdea();
                }
            });
        });
    </script>
</body>
</html>
