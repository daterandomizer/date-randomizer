<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рандомайзер Свиданий</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            background: linear-gradient(135deg, #ffe0e5 0%, #ffd4d8 25%, #f5d5d0 50%, #ead5d5 75%, #e0d0d0 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,182,193,0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(216,191,216,0.1) 0%, transparent 70%);
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        .heart-decoration {
            position: fixed;
            font-size: 20px;
            opacity: 0.08;
            animation: floatHeart 15s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        .heart-decoration:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .heart-decoration:nth-child(2) { top: 20%; right: 15%; animation-delay: 3s; }
        .heart-decoration:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 6s; }
        .heart-decoration:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 9s; }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.08; }
            50% { transform: translateY(-20px) scale(1.1); opacity: 0.12; }
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            background: linear-gradient(135deg, #c47d8a 0%, #a06570 50%, #8b5e5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header-icon {
            display: inline-block;
            width: 40px;
            height: 40px;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            10%, 30% { transform: scale(1.1); }
            20%, 40% { transform: scale(1); }
        }

        .header p {
            color: #a07878;
            font-size: 1.1em;
            font-weight: 400;
            opacity: 0.9;
        }

        .icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            vertical-align: middle;
        }

        .icon-lg {
            width: 24px;
            height: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 
                0 10px 40px rgba(139, 94, 94, 0.15),
                0 2px 10px rgba(139, 94, 94, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 16px;
            color: #8b5e5e;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            font-family: 'Comfortaa', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(212, 165, 165, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .tab:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(139, 94, 94, 0.2);
        }

        .tab:hover::before {
            width: 300px;
            height: 300px;
        }

        .tab.active {
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 100%);
            color: white;
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 
                0 8px 25px rgba(139, 94, 94, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-content.active {
            display: block;
        }

        .filters {
            margin-bottom: 25px;
        }

        .filter-group {
            margin-bottom: 25px;
        }

        .filter-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8b5e5e;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 1em;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            padding: 12px 22px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 25px;
            color: #8b5e5e;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.95em;
            font-weight: 500;
            font-family: 'Comfortaa', cursive;
            position: relative;
            overflow: hidden;
        }

        .filter-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 196, 208, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .filter-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.15);
        }

        .filter-btn:hover::after {
            width: 200px;
            height: 200px;
        }

        .filter-btn.selected {
            background: linear-gradient(135deg, #ffc4d0 0%, #ffb3c6 100%);
            border-color: #d4a5a5;
            color: #6b4545;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 
                0 6px 20px rgba(212, 165, 165, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .jar-container {
            position: relative;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        #jar-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #jar-canvas:active {
            cursor: grabbing;
        }

        .note-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            min-height: 120px;
            background: linear-gradient(135deg, #fff9f0 0%, #fff5e6 100%);
            border: 2px solid #d4a5a5;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            color: #8b5e5e;
            font-size: 1em;
            line-height: 1.5;
            font-weight: 500;
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.15),
                inset 0 1px 0 rgba(255,255,255,0.8);
            font-family: 'Caveat', cursive;
            font-size: 1.15em;
            z-index: 5;
            pointer-events: none;
        }

        .note-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 1px,
                    rgba(212, 165, 165, 0.03) 2px,
                    rgba(212, 165, 165, 0.03) 3px
                );
            border-radius: 10px;
            pointer-events: none;
        }

        .note-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 20px 20px 0;
            border-color: transparent #f0d5d0 transparent transparent;
            border-radius: 0 0 0 3px;
        }

        .note-overlay.hidden {
            opacity: 0;
            transform: translate(-50%, 150%) scale(0.3);
            pointer-events: none;
        }

        .note-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: popOut 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
        }

        @keyframes popOut {
            0% {
                transform: translate(-50%, 150%) scale(0.3);
                opacity: 0;
            }
            60% {
                transform: translate(-50%, -55%) scale(1.08);
            }
            80% {
                transform: translate(-50%, -48%) scale(0.98);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .note-text {
            margin-bottom: 10px;
        }

        .remove-idea-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #cc9999 0%, #b88989 100%);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            font-family: 'Comfortaa', cursive;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 8px;
            pointer-events: auto;
            box-shadow: 0 3px 10px rgba(139, 94, 94, 0.2);
        }

        .remove-idea-btn:hover {
            background: linear-gradient(135deg, #b88989 0%, #a07878 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 94, 94, 0.3);
        }

        .randomize-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #d4a5a5 0%, #c98d8d 50%, #b88989 100%);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 6px 25px rgba(139, 94, 94, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            font-family: 'Comfortaa', cursive;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .randomize-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.7s;
        }

        .randomize-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 10px 35px rgba(139, 94, 94, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .randomize-btn:hover::before {
            left: 100%;
        }

        .randomize-btn:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.3);
        }

        .custom-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .custom-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #f0e0e0;
            border-radius: 16px;
            font-size: 1em;
            color: #8b5e5e;
            font-family: 'Comfortaa', cursive;
            transition: all 0.3s;
            background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        }

        .custom-input:focus {
            outline: none;
            border-color: #d4a5a5;
            box-shadow: 0 0 0 4px rgba(212, 165, 165, 0.1);
            transform: translateY(-2px);
        }

        .add-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #d4a5a5 0%, #b88989 100%);
            border: none;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1.1em;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.25);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 94, 94, 0.35);
        }

        .delete-btn {
            background: linear-gradient(135deg, #cc9999 0%, #b88989 100%);
            padding: 10px 16px;
            font-size: 0.9em;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Comfortaa', cursive;
            box-shadow: 0 3px 10px rgba(139, 94, 94, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #b88989 0%, #a07878 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 94, 94, 0.3);
        }

        .custom-list, .history-list {
            list-style: none;
        }

        .custom-item, .history-item {
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8b5e5e;
            transition: all 0.3s;
            border: 1px solid rgba(212, 165, 165, 0.2);
        }

        .custom-item:hover, .history-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.1);
        }

        .history-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        .history-item-title {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .history-item-date {
            font-size: 0.85em;
            color: #a07878;
            opacity: 0.8;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 0.9em;
        }

        .checkbox-label input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #d4a5a5;
        }

        .history-item.completed {
            opacity: 0.5;
            filter: grayscale(0.3);
        }

        .history-item.completed .history-item-title {
            text-decoration: line-through;
        }

        .empty-message {
            text-align: center;
            color: #a07878;
            padding: 40px 20px;
            font-style: italic;
            opacity: 0.7;
        }

        .mode-switch {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #f8e8e8 0%, #f0e0e0 100%);
            border: 2px solid transparent;
            border-radius: 16px;
            color: #8b5e5e;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 600;
            font-family: 'Comfortaa', cursive;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 94, 94, 0.15);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ffc4d0 0%, #ffb3c6 100%);
            border-color: #d4a5a5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 165, 165, 0.3);
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .card {
                padding: 25px;
            }
            
            .jar-container {
                height: 380px;
            }

            .note-overlay {
                width: 150px;
                min-height: 100px;
                font-size: 1em;
            }
        }
    </style>
</head>

            { id: 178, title: "Попробовать фуд-корт в торговом центре", budget: "paid", location: "outdoor", mood: "food", season: "any" },
            { id: 179, title: "Сходить в чайный дом на дегустацию", budget: "paid", location: "outdoor", mood: "food", season: "any" },

            { id: 181, title: "Заказать дегустационное меню в ресторане", budget: "paid", location: "outdoor", mood: "food", season: "any" },
            { id: 182, title: "Посетить пекарню рано утром за свежей выпечкой", budget: "paid", location: "outdoor", mood: "food", season: "any" },

            { id: 184, title: "Собрать грибы/ягоды и приготовить вместе", budget: "free", location: "outdoor", mood: "food", season: "autumn" },
        ];

        let filters = {
            budget: 'all',
            location: 'all',
            mood: 'all',
            season: 'all'
        };
        let currentMode = 'preset';
        let currentIdeaId = null;
        let customIdeas = JSON.parse(localStorage.getItem('customIdeas')) || [];
        let history = JSON.parse(localStorage.getItem('dateHistory')) || [];
        let removedIdeas = JSON.parse(localStorage.getItem('removedIdeas')) || [];

        let scene, camera, renderer, jar, lid;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        function initThreeJS() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ 
                canvas: container, 
                alpha: true, 
                antialias: true 
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 10, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffd4d8, 0.4);
            directionalLight2.position.set(-5, -5, 5);
            scene.add(directionalLight2);

            const lidGeometry = new THREE.CylinderGeometry(1.2, 1.3, 0.3, 32);
            const lidMaterial = new THREE.MeshPhongMaterial({
                color: 0xc98d8d,
                shininess: 40,
                specular: 0x666666
            });
            lid = new THREE.Mesh(lidGeometry, lidMaterial);
            lid.position.y = 2.2;
            scene.add(lid);

            const knobGeometry = new THREE.CylinderGeometry(0.2, 0.25, 0.3, 16);
            const knob = new THREE.Mesh(knobGeometry, lidMaterial);
            knob.position.y = 2.5;
            scene.add(knob);

            const jarGeometry = new THREE.CylinderGeometry(1.5, 1.5, 4, 32, 1, true);
            const jarMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xfff5f0,
                metalness: 0.1,
                roughness: 0.05,
                transparent: true,
                opacity: 0.4,
                transmission: 0.85,
                thickness: 0.8,
                envMapIntensity: 1,
                clearcoat: 1,
                clearcoatRoughness: 0.05
            });
            jar = new THREE.Mesh(jarGeometry, jarMaterial);
            jar.position.y = 0;
            scene.add(jar);

            const edgeGeometry = new THREE.EdgesGeometry(jarGeometry);
            const edgeMaterial = new THREE.LineBasicMaterial({ 
                color: 0xd4a5a5, 
                linewidth: 2,
                transparent: true,
                opacity: 0.3
            });
            const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
            jar.add(edges);

            const bottomGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.15, 32);
            const bottomMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xf5e8e8,
                transparent: true,
                opacity: 0.5,
                metalness: 0.1,
                roughness: 0.2
            });
            const bottom = new THREE.Mesh(bottomGeometry, bottomMaterial);
            bottom.position.y = -2;
            scene.add(bottom);

            container.addEventListener('mousemove', onMouseMove, false);
            container.addEventListener('touchmove', onTouchMove, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onMouseMove(event) {
            const rect = event.target.getBoundingClientRect();
            mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            targetRotationY = mouseX * 0.3;
            targetRotationX = mouseY * 0.2;
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                const rect = event.target.getBoundingClientRect();
                mouseX = ((event.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
                mouseY = -((event.touches[0].clientY - rect.top) / rect.height) * 2 + 1;
                targetRotationY = mouseX * 0.3;
                targetRotationX = mouseY * 0.2;
            }
        }

        function onWindowResize() {
            const container = document.getElementById('jar-canvas');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            jar.rotation.y += (targetRotationY - jar.rotation.y) * 0.05;
            jar.rotation.x += (targetRotationX - jar.rotation.x) * 0.05;
            lid.rotation.y = jar.rotation.y;
            lid.rotation.x = jar.rotation.x;

            jar.rotation.y += 0.001;
            lid.rotation.y += 0.001;

            renderer.render(scene, camera);
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const filterType = e.target.dataset.filter;
                    const value = e.target.dataset.value;
                    
                    document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(b => {
                        b.classList.remove('selected');
                    });
                    
                    e.target.classList.add('selected');
                    filters[filterType] = value;
                });
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('preset-filters').style.display = mode === 'preset' ? 'block' : 'none';
        }

        function randomize() {
            const note = document.getElementById('note');
            const noteText = document.getElementById('note-text');
            const removeBtn = document.getElementById('remove-btn');
            let selectedDate, selectedId;

            if (currentMode === 'preset') {
                let filteredIdeas = dateIdeas.filter(idea => {
                    if (removedIdeas.includes(idea.id)) return false;
                    
                    return (filters.budget === 'all' || idea.budget === filters.budget) &&
                           (filters.location === 'all' || idea.location === filters.location) &&
                           (filters.mood === 'all' || idea.mood === filters.mood) &&
                           (filters.season === 'all' || idea.season === 'any' || idea.season === filters.season);
                });

                if (filteredIdeas.length === 0) {
                    noteText.textContent = 'Нет идей с такими фильтрами';
                    removeBtn.classList.add('hidden');
                    note.classList.remove('hidden');
                    note.classList.add('show');
                    return;
                }

                const selected = filteredIdeas[Math.floor(Math.random() * filteredIdeas.length)];
                selectedDate = selected.title;
                selectedId = selected.id;
            } else {
                if (customIdeas.length === 0) {
                    noteText.textContent = 'Добавьте свои идеи на вкладке "Свои идеи"';
                    removeBtn.classList.add('hidden');
                    note.classList.remove('hidden');
                    note.classList.add('show');
                    return;
                }
                selectedDate = customIdeas[Math.floor(Math.random() * customIdeas.length)];
                selectedId = null;
            }

            currentIdeaId = selectedId;

            note.classList.remove('show');
            note.classList.add('hidden');
            
            setTimeout(() => {
                noteText.textContent = selectedDate;
                if (selectedId !== null) {
                    removeBtn.classList.remove('hidden');
                } else {
                    removeBtn.classList.add('hidden');
                }
                note.classList.remove('hidden');
                void note.offsetWidth;
                note.classList.add('show');
                addToHistory(selectedDate);
            }, 200);
        }

        function removeCurrentIdea() {
            if (currentIdeaId !== null && !removedIdeas.includes(currentIdeaId)) {
                removedIdeas.push(currentIdeaId);
                localStorage.setItem('removedIdeas', JSON.stringify(removedIdeas));
                
                const note = document.getElementById('note');
                const noteText = document.getElementById('note-text');
                const removeBtn = document.getElementById('remove-btn');
                
                noteText.textContent = 'Идея удалена. Нажмите кнопку ниже для новой';
                removeBtn.classList.add('hidden');
                
                currentIdeaId = null;
            }
        }

        function addCustomIdea() {
            const input = document.getElementById('custom-idea-input');
            const idea = input.value.trim();
            
            if (idea) {
                customIdeas.push(idea);
                localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
                input.value = '';
                renderCustomList();
            }
        }

        function renderCustomList() {
            const list = document.getElementById('custom-list');
            const empty = document.getElementById('custom-empty');
            
            if (customIdeas.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = customIdeas.map((idea, index) => `
                    <li class="custom-item">
                        <span>${idea}</span>
                        <button class="delete-btn" onclick="deleteCustomIdea(${index})">
                            <svg class="icon"><use href="#icon-trash"/></svg>
                        </button>
                    </li>
                `).join('');
            }
        }

        function deleteCustomIdea(index) {
            customIdeas.splice(index, 1);
            localStorage.setItem('customIdeas', JSON.stringify(customIdeas));
            renderCustomList();
        }

        function addToHistory(dateTitle) {
            const historyItem = {
                id: Date.now(),
                title: dateTitle,
                date: new Date().toLocaleDateString('ru-RU'),
                completed: false
            };
            
            history.unshift(historyItem);
            localStorage.setItem('dateHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const empty = document.getElementById('history-empty');
            
            if (history.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'block';
            } else {
                list.style.display = 'block';
                empty.style.display = 'none';
                list.innerHTML = history.map(item => `
                    <li class="history-item ${item.completed ? 'completed' : ''}">
                        <div class="history-item-header">
                            <div>
                                <div class="history-item-title">${item.title}</div>
                                <div class="history-item-date">${item.date}</div>
                            </div>
                            <label class="checkbox-label">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} 
                                       onchange="toggleCompleted(${item.id})">
                                <span>Выполнено</span>
                            </label>
                        </div>
                    </li>
                `).join('');
            }
        }

        function toggleCompleted(id) {
            const item = history.find(h => h.id === id);
            if (item) {
                item.completed = !item.completed;
                localStorage.setItem('dateHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            setupFilters();
            renderCustomList();
            renderHistory();
            
            document.getElementById('custom-idea-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addCustomIdea();
                }
            });
        });
    </script>
